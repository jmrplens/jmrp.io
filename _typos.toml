[files]
extend-exclude = [
    "cv_latex/**",
    "public/pdf/**",
    "src/content/publications_data/papers.bib",
    "src/pages/rss.xml.ts",
    "pnpm-lock.yaml",
    "package-lock.json",
    "schema-report.json",
    "schema-report.html",
    "html-validation.json",
    "accessibility-report.json",
    "lighthouse-results/**"
]

[default]
extend-ignore-re = [
    "(?m)^[a-zA-Z0-9+/=]{20,}$"
]

[default.extend-words]
routeros = "routeros"
PNGs = "PNGs"
PN = "PN"
BA = "BA"
dorder = "dorder"
nd = "nd"
comando = "comando"
Cliente = "Cliente"
Yoh = "Yoh"

[default.extend-identifiers]
# Technical protocol/standard names
BACnet = "BACnet"
UPnP = "UPnP"
# CSS class prefixes (component abbreviations)
ba = "ba"
sbs = "sbs"
tl = "tl"
sr = "sr"
bs = "bs"
