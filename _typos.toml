[files]
extend-exclude = [
    "cv_latex/**",
    "public/pdf/**",
    "src/content/publications_data/papers.bib",
    "src/pages/rss.xml.ts",
    "pnpm-lock.yaml",
    "package-lock.json",
    "schema-report.json",
    "schema-report.html",
    "html-validation.json",
    "accessibility-report.json"
]

[default]
extend-ignore-re = [
    "(?m)^[a-zA-Z0-9+/=]{20,}$"
]

[default.extend-words]
routeros = "routeros"
