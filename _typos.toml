[files]
extend-exclude = [
    "cv_latex/**",
    "public/pdf/**",
    "src/content/publications_data/papers.bib",
    "src/pages/rss.xml.ts",
    "pnpm-lock.yaml",
    "package-lock.json",
    "schema-report.json",
    "schema-report.html",
    "html-validation.json",
    "accessibility-report.json",
    "lighthouse-results/**",
    "AI_CONFIG_TASKS.md",
    "AI_CONTEXT_ROADMAP.md",
    "SEO_AUDIT.md",
    "docs/I18N_PLAN.md",
    "docs/I18N_RESEARCH.md"
]

[default]
extend-ignore-re = [
    "(?m)^[a-zA-Z0-9+/=]{20,}$"
]

[default.extend-words]
routeros = "routeros"
PNGs = "PNGs"
PN = "PN"
BA = "BA"
dorder = "dorder"
nd = "nd"
Yoh = "Yoh"
# Spanish words (i18n bilingual content)
algoritmos = "algoritmos"
aplicable = "aplicable"
clases = "clases"
clientes = "clientes"
comando = "comando"
Cliente = "Cliente"
computacional = "computacional"
curso = "curso"
dentistas = "dentistas"
emergencias = "emergencias"
inicial = "inicial"
instituto = "instituto"
mis = "mis"
oficial = "oficial"
profesional = "profesional"
programa = "programa"
protocolos = "protocolos"
versiones = "versiones"

[default.extend-identifiers]
# Technical protocol/standard names
BACnet = "BACnet"
UPnP = "UPnP"
# CSS class prefixes (component abbreviations)
ba = "ba"
sbs = "sbs"
tl = "tl"
sr = "sr"
bs = "bs"
