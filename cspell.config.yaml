# CSpell Configuration — jmrp.io
# Bilingual spell checker (English + Spanish)
# Docs: https://cspell.org/configuration/

version: "0.2"
language: en

# Import Spanish dictionary
import:
  - "@cspell/dict-es-es/cspell-ext.json"

# Dictionaries to always enable (Spanish activates via overrides)
dictionaryDefinitions:
  - name: project-words
    path: ./cspell-project-words.txt
    addWords: true
    description: "Project-specific terms, names, and technical vocabulary"

dictionaries:
  - project-words
  - typescript
  - html
  - css
  - node
  - npm
  - bash
  - shellscript
  - fullstack
  - softwareTerms
  - networking-terms
  - en_us

# Additional words not in the project word list
# (for new terms, add directly to cspell-project-words.txt instead)
words: []

# Patterns to ignore (base64 strings, hashes, etc.)
ignoreRegExpList:
  - /[a-zA-Z0-9+/=]{20,}/g
  - /\b[0-9a-f]{32,}\b/gi
  - /nonce-[A-Za-z0-9+/=]+/g
  - /sha256-[A-Za-z0-9+/=]+/g
  - /sha384-[A-Za-z0-9+/=]+/g
  - /sha512-[A-Za-z0-9+/=]+/g

# Files and directories to skip entirely
ignorePaths:
  - node_modules
  - dist
  - dist_new
  - dist_old
  - builds
  - plan
  - .git
  - plan/** # gitignored working notes (Spanish prose), not part of the project
  # Verbatim snapshot of the Bluesky feed-generator records: names and
  # descriptions in eight languages (de, fr, it, ja, nl, pt…), copied exactly
  # as published. Spell-checking EN/ES dictionaries against them is all noise.
  - src/data/bluesky-feeds.json
  # Vendored third-party script (Cloudflare's beacon, self-hosted): its
  # minified identifiers are not project vocabulary.
  - public/scripts/cf-beacon.js
  - CHANGELOG-review.md # Spanish design-review report, not project content
  - design-audit/** # temporary generated screenshots + HTML for the design review
  - pnpm-lock.yaml
  - package-lock.json
  - "*.trie.gz"
  - "*.woff2"
  - "*.woff"
  - cv_latex/**
  - scripts/cv/** # LaTeX/ATS generator toolchain (LaTeX macros + Spanish template strings)
  - public/pdf/**
  - src/content/publications_data/papers.bib
  - schema-report.json
  - schema-report.html
  - html-validation.json
  - rss-validation.json
  - accessibility-report/**
  - skills-lock.json
  - accessibility-report.json
  - tools.yaml
  - lighthouse-results/**
  - playwright-report/**
  - test-results/**
  - screenshots-linkedin/**
  - AI_CONFIG_TASKS.md
  - AI_CONTEXT_ROADMAP.md
  - SEO_AUDIT.md
  - docs/I18N_PLAN.md
  - docs/I18N_RESEARCH.md
  - "*.tmLanguage.json"

# Per-path language overrides
overrides:
  # Global style system carries Spanish design-token comments (Lab system)
  - filename: "src/styles/{tokens,base,utilities,global}.css"
    language: es,en
  # Spanish content — check against BOTH English and Spanish dictionaries
  - filename: "src/content/posts/es/**"
    language: es,en
  - filename: "src/content/tools/es/**"
    language: es,en
  - filename: "src/content/cv/es.yaml"
    language: es,en
  - filename: "src/i18n/translations/es/**"
    language: es,en
  # Per-component markdown modules hold their own bilingual labels
  - filename: "src/components/**/*.md.ts"
    language: es,en
  # About/Uses/Now pages carry inline bilingual (ES+EN) prose content
  - filename: "src/components/pages/{About,Uses,Now}Page.astro"
    language: es,en
  # Profile content collection (About/Uses page data) carries bilingual
  # (ES+EN) bio/homelab prose per-locale, same as the *Page.astro components above
  - filename: "src/content/profile/*.yaml"
    language: es,en
  # OG image generator has per-locale (ES+EN) titles/subtitles/category labels
  - filename: "src/pages/og/**"
    language: es,en
  # llms.txt/llms-full.txt generator carries the per-locale profile prose that
  # feeds the Spanish AI-context document, same as the *Page.astro files above
  - filename: "src/utils/llms.ts"
    language: es,en
  # PDF metadata script has Spanish certificate/course names
  - filename: "scripts/optimize-pdf-metadata.py"
    language: es,en
  # RSS template has odd interpolation patterns
  - filename: "src/pages/rss.xml.ts"
    enabled: false
