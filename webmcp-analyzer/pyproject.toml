[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webmcp-analyzer"
version = "0.2.0"
description = "Validate, test, and analyze WebMCP implementations on any website"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "José Manuel Requena Plens", email = "jmrplens@jmrp.io" }]
keywords = ["webmcp", "w3c", "validator", "analyzer", "ai", "model-context"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25"]

[project.scripts]
webmcp-analyzer = "webmcp_analyzer.cli:main"

[project.urls]
Homepage = "https://jmrp.io/tools/webmcp-tester/"
Repository = "https://github.com/jmrplens/jmrp.io"
Specification = "https://webmachinelearning.github.io/webmcp/"

[tool.hatch.build.targets.wheel]
packages = ["webmcp_analyzer"]
