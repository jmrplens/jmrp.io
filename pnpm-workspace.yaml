packages:
  - "."

# This project deliberately tracks the latest releases (incl. day-0, per
# CLAUDE.md). Disable pnpm 11's default 24h supply-chain age gate, which
# would otherwise block freshly-published packages like Astro 7.
minimumReleaseAge: 0

# Packages allowed to run install/build scripts. pnpm 11 replaces the v10
# onlyBuiltDependencies allowlist with this map.
allowBuilds:
  citation-js: true
  esbuild: true
  puppeteer: true
  sharp: true
  sonar-scanner: true

# Migrated from package.json#pnpm (pnpm 11 no longer reads that field).
overrides:
  "form-data": ">=4.0.0"
  "qs": ">=6.14.2"
  "tmp": ">=0.2.5"
  "glob": "^13.0.6"
  "rimraf": ">=6.1.2"
  "uuid": ">=9.0.0"
  "whatwg-encoding": ">=3.1.1"
  "lodash": ">=4.17.23"
  "lodash-es": ">=4.17.23"
  "@vercel/blob": ">=2.2.0"
  "path-to-regexp": ">=6.3.0"
  "shiki": "^4.4.3"
  # Scoped (range-selector) overrides: only the vulnerable instances are
  # remapped, so old-major consumers (minimatch's brace-expansion@1, eslint's
  # ajv@6) keep the version they were built against.
  "brace-expansion@>=4.0.0 <5.0.9": ">=5.0.9"
  "ajv@>=7.0.0 <8.18.0": ">=8.18.0"
  "esbuild@>=0.27.3 <0.28.1": ">=0.28.1"
  "fast-uri@>=3.0.0 <3.1.5": ">=3.1.5"
  "undici@>=6.0.0 <6.28.0": "^6.28.0"
  "eslint": "^10.9.1"
  "vite": "^8.2.2"
  "@astrojs/markdown-remark>smol-toml": "^1.6.1"
  "@astrojs/yaml2ts>yaml": "^2.8.3"
  "@mapbox/node-pre-gyp>tar": "^7.5.11"
  "@rollup/pluginutils@^4>picomatch": "^2.3.2"
  "@rollup/pluginutils@^5>picomatch": "^4.0.4"
  "@vercel/backends>srvx": "^0.11.13"
  "@vercel/blob>undici": "^6.28.0"
  "@vercel/fun>@tootallnate/once": "^3.0.1"
  "@vercel/fun>tar": "^7.5.11"
  "@vercel/node>undici": "^6.27.0"
  "@vercel/python-analysis>js-yaml": "^4.3.0"
  "@vercel/python-analysis>minimatch": "^10.2.3"
  "@vercel/python-analysis>smol-toml": "^1.6.1"
  "@vercel/rust>smol-toml": "^1.6.1"
  "@vercel/sandbox>undici": "^7.24.0"
  "anymatch>picomatch": "^2.3.2"
  "astro>smol-toml": "^1.6.1"
  "cheerio>undici": "^7.24.0"
  "fdir>picomatch": "^4.0.4"
  "flat-cache>flatted": "^3.4.2"
  "get-uri>basic-ftp": "^5.2.1"
  "mermaid>dompurify": "^3.3.2"
  "micromatch>picomatch": "^2.3.2"
  # Only minimatch@3 pulls the vulnerable brace-expansion 1.x; 9 and 10 are
  # already on 5.x, so the parent is version-scoped to leave them alone.
  "minimatch@3>brace-expansion": "^1.1.17"
  "patch-package>yaml": "^2.8.3"
  "tinyglobby>picomatch": "^4.0.4"
  "vercel>smol-toml": "^1.6.1"
  "vercel>undici": "^6.27.0"
  "yaml-language-server>yaml": "^2.8.3"

peerDependencyRules:
  allowedVersions:
    eslint: ">=10"

auditConfig:
  ignoreGhsas:
    # extract-zip symlink advisory: the "patched" 2.0.2 is unpublished (latest
    # on npm is still 2.0.1). Dev-only chain (lighthouse > puppeteer-core >
    # @puppeteer/browsers) extracting Google-served Chrome archives. Remove
    # this entry as soon as extract-zip >2.0.1 ships. Reviewed 2026-08-13.
    - GHSA-jmr9-qjv8-65gv
