name: Cleanup CI Reports

on:
  workflow_dispatch:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.repository == 'jmrplens/jmrp.io'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Remove PR Reports from Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node scripts/ci/cleanup-deployments.mjs ${{ github.event.pull_request.number }}
