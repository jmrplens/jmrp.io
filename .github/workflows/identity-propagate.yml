# Propagates the canonical artifacts to the sites that read them: the `#person`
# document every project site splices into its graph, and the project list the
# documentation hub builds its own pages from.
#
# Fires ONLY when a push to `main` carries a diff in one of them: the `paths`
# filter IS the condition, not a check performed afterwards, so a merge that
# touches neither costs no Actions time at all.
#
# What it does lives in scripts/ci/propagate-identity.mjs: dispatch each
# consumer's docs build. That is the whole job since 2026-09-15, when the
# committed `person.snapshot.json` fallback was removed from every consumer:
# they fetch the canonical document at build time and fail the build if they
# cannot read it, so a rebuild is the only thing propagation has to arrange.
#
# The dispatch waits first, about five and a half minutes: the consumers fetch
# from raw.githubusercontent.com, whose cache nodes keep a copy for max-age=300,
# and a build dispatched straight after the merge could get the previous file
# (libgen-mcp did, 2026-11-07). See scripts/ci/raw-freshness.mjs.

name: Identity propagation

on:
  push:
    branches: [main]
    paths: ["public/identity/person.jsonld", "public/identity/projects.json"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be written, touching no repository"
        type: boolean
        default: false

permissions:
  contents: read

# No cancellation: two runs in a row are two identity changes, and aborting the
# first would leave some consumers synced and others not.
concurrency:
  group: identity-propagation
  cancel-in-progress: false

jobs:
  propagate:
    name: Sync the consumers
    runs-on: ubuntu-latest
    # The raw cache wait is about 5.5 min and its checks up to 3 more; anything
    # past this is a hang, not a slow cache.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The script reads each consumer's workflow with js-yaml (since #499,
      # to know whether the push it makes will trigger a build), so it needs
      # the tree installed like any other job. The run #499 itself triggered
      # died on `Cannot find package 'js-yaml'` before touching a consumer.
      - uses: ./.github/actions/setup

      - name: Dispatch the consumer builds
        env:
          IDENTITY_SYNC_TOKEN: ${{ secrets.IDENTITY_SYNC_TOKEN }}
        run: |
          node scripts/ci/propagate-identity.mjs \
            ${{ inputs.dry_run && '--dry-run' || '' }}
