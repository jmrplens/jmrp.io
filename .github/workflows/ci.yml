name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 9 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Astro Check
        run: pnpm exec astro check
      - name: Prettier Check
        run: pnpm exec prettier --check .
      - name: Security Audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

  link-checker:
    name: Link Checker (Lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore lychee cache
        uses: actions/cache@v5
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-
      - name: Check Links
        uses: lycheeverse/lychee-action@v2.7.0
        with:
          args: >-
            --cache 
            --max-cache-age 1d 
            --verbose 
            --no-progress 
            --exclude 'https://mstdn.jmrp.io'
            --exclude 'https://electronica-submarina.com'
            --exclude 'https://ies-berlanga.info'
            --exclude 'https://www.i3m-detectors.i3m.upv.es'
            './**/*.md' 
            './**/*.mdx' 
            './**/*.html' 
            './src/**/*.astro' 
            './src/**/*.ts'
            './src/**/*.tsx'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}

  spell-checker:
    name: Spell Checker (Typos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Spelling
        uses: crate-ci/typos@master

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}

  snyk-security:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
        continue-on-error: true

  build:
    name: Build Artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Build Project (Production)
        run: pnpm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist-build
          path: dist/
          retention-days: 1

  accessibility:
    name: Accessibility Tests (${{ matrix.theme }} mode)
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        theme: [light, dark]
      fail-fast: false
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-build
          path: dist
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Axe accessibility tests
        run: THEME=${{ matrix.theme }} pnpm exec playwright test --project=accessibility
      - name: Upload Axe Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: axe-accessibility-report-${{ matrix.theme }}
          path: accessibility-report/
          retention-days: 7
      - name: Deploy Accessibility Report to Surge
        if: github.event_name == 'pull_request' && always()
        shell: bash
        run: |
          mkdir -p a11y-deploy
          cp accessibility-report/*.html a11y-deploy/
          REPORT_FILE=$(ls a11y-deploy/ | grep "home" | head -n 1)
          if [ -n "$REPORT_FILE" ]; then cp "a11y-deploy/$REPORT_FILE" a11y-deploy/index.html; fi
          pnpm exec surge ./a11y-deploy jmrp-a11y-pr-${{ github.event.number }}-${{ matrix.theme }}.surge.sh --token ${{ secrets.SURGE_TOKEN }}
      - name: Post Accessibility Comment (${{ matrix.theme }} mode)
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v8
        env:
          THEME: ${{ matrix.theme }}
          SURGE_URL: jmrp-a11y-pr-${{ github.event.number }}-${{ matrix.theme }}.surge.sh
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/post-accessibility-comment.mjs`)
            await script({github, context})

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-build
          path: dist
      - name: Analyze bundle size
        run: |
          echo "## 📦 Bundle Size Analysis" >> $GITHUB_STEP_SUMMARY
          find dist/_astro -name "*.js" -type f -exec ls -lh {} \; | awk '{print "- "$9": "$5}' >> $GITHUB_STEP_SUMMARY
          du -sh dist | awk '{print "**Total**: "$1}' >> $GITHUB_STEP_SUMMARY

  release-drafter:
    name: Update Release Draft
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}

  html-validator:
    name: HTML Validation
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-build
          path: dist
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Validate HTML5
        run: |
          pnpm exec html-validate -c .htmlvalidate.json --formatter json dist > html-validation.json || true
          pnpm exec html-validate -c .htmlvalidate.json --formatter html dist > html-report-body.html || true

          # Generate file list for transparency
          echo '<details style="margin-top:20px;padding:10px;border:1px solid #eee;border-radius:8px;"><summary><b>📄 View Analyzed Files</b></summary><ul style="font-family:monospace;font-size:12px;column-count:2;">' > html-file-list.html
          find dist -type f -name "*.html" | sort | sed 's|dist/|<li>|g' | sed 's|$|</li>|g' >> html-file-list.html
          echo '</ul></details>' >> html-file-list.html

          # Wrap everything in a full HTML document
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>HTML Validation Report</title><style>body{font-family:sans-serif;padding:20px;line-height:1.5}.container{max-width:1200px;margin:0 auto}h1{border-bottom:1px solid #eee} .success{color:#2ea043;background:#f0fff4;padding:20px;border-radius:8px;border:1px solid #2ea043} summary{cursor:pointer;color:#666}</style></head><body><div class="container"><h1>HTML Validation Report</h1>' > html-report.html

          if [ -s html-report-body.html ]; then
            cat html-report-body.html >> html-report.html
          else
            echo '<div class="success"><h2>✅ No issues found!</h2><p>All HTML files are valid according to your configuration.</p></div>' >> html-report.html
          fi

          cat html-file-list.html >> html-report.html
          echo '</div></body></html>' >> html-report.html
      - name: Deploy HTML Report to Surge
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mkdir -p html-deploy
          cp html-report.html html-deploy/index.html
          pnpm exec surge ./html-deploy jmrp-html-pr-${{ github.event.number }}.surge.sh --token ${{ secrets.SURGE_TOKEN }}
      - name: Post HTML Validation Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          SURGE_URL: jmrp-html-pr-${{ github.event.number }}.surge.sh
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/post-html-validation-comment.mjs`)
            await script({github, context})

  rss-validation:
    name: RSS Feed Validation
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-build
          path: dist
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Validate RSS feed
        run: node scripts/ci/validate-rss.mjs dist/rss.xml
      - name: Generate RSS preview
        run: node scripts/preview-rss.mjs
      - name: Upload RSS preview artifact
        uses: actions/upload-artifact@v6
        with:
          name: rss-preview
          path: dist/rss-preview.html
          retention-days: 3
      - name: Deploy RSS Preview to Surge
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mkdir -p preview-deploy
          cp dist/rss-preview.html preview-deploy/index.html
          pnpm exec surge ./preview-deploy jmrp-rss-pr-${{ github.event.number }}.surge.sh --token ${{ secrets.SURGE_TOKEN }}
      - name: Post RSS Validation Comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v8
        env:
          SURGE_URL: jmrp-rss-pr-${{ github.event.number }}.surge.sh
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/post-rss-validation-comment.mjs`)
            await script({github, context})

  schema-validation:
    name: Schema.org JSON-LD Validation
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-build
          path: dist
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Validate Schema.org structured data
        run: node scripts/ci/validate-schema.mjs dist
      - name: Post Schema Validation Comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v8
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/post-schema-validation-comment.mjs`)
            await script({github, context})

  image-optimization:
    name: Image Optimization Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-build
          path: dist
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Analyze images
        run: |
          echo "## 🖼️ Image Optimization Analysis" >> $GITHUB_STEP_SUMMARY
          WEBP_COUNT=$(find dist -type f -name "*.webp" | wc -l)
          echo "- WebP images: $WEBP_COUNT ✅" >> $GITHUB_STEP_SUMMARY
      - name: Generate Image HTML Report
        run: node scripts/ci/generate-image-report.mjs
      - name: Deploy Image Report to Surge
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mkdir -p img-deploy
          cp image-report.html img-deploy/index.html
          pnpm exec surge ./img-deploy jmrp-img-pr-${{ github.event.number }}.surge.sh --token ${{ secrets.SURGE_TOKEN }}
      - name: Post Image Optimization Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          SURGE_URL: jmrp-img-pr-${{ github.event.number }}.surge.sh
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/post-image-optimization-comment.mjs`)
            await script({github, context})

  lighthouse-dual-theme:
    name: Lighthouse (${{ matrix.theme }} mode)
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        theme: [light, dark]
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-build
          path: dist
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run Lighthouse CI
        shell: bash
        run: |
          npm install -g @lhci/cli
          if [ "${{ matrix.theme }}" = "dark" ]; then export LHCI_CHROME_FLAGS="--force-dark-mode --force-prefers-color-scheme=dark"; fi
          lhci autorun | tee lhci_output_${{ matrix.theme }}.txt
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
      - name: Format Lighthouse Report
        if: always()
        run: THEME=${{ matrix.theme }} node scripts/ci/format-lighthouse-report.js > lighthouse_comment_${{ matrix.theme }}.md
      - name: Deploy Lighthouse Report to Surge
        if: github.event_name == 'pull_request' && always()
        shell: bash
        run: |
          mkdir -p lh-deploy
          cp -r .lighthouseci/* lh-deploy/ || true
          REPORT_FILE=$(find lh-deploy -name "*.html" | head -n 1)
          if [ -n "$REPORT_FILE" ]; then cp "$REPORT_FILE" lh-deploy/index.html; else echo "<h1>Lighthouse Report not found</h1>" > lh-deploy/index.html; fi
          pnpm exec surge ./lh-deploy jmrp-lh-pr-${{ github.event.number }}-${{ matrix.theme }}.surge.sh --token ${{ secrets.SURGE_TOKEN }}
      - name: Post Comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v8
        env:
          THEME: ${{ matrix.theme }}
          SURGE_URL: jmrp-lh-pr-${{ github.event.number }}-${{ matrix.theme }}.surge.sh
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/post-lighthouse-comment.mjs`)
            await script({github, context})

  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-build
          path: dist
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright tests
        run: pnpm exec playwright test --project=functional
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: functional-test-report
          path: playwright-report/
          retention-days: 7
