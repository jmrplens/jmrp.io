name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }} - ${{ github.ref }}
  cancel-in-progress: true

# Suppress deprecation warnings from upstream GitHub Actions dependencies
env:
  NODE_OPTIONS: "--no-deprecation"

jobs:
  ci-setup:
    name: "🚀 Initialize CI Report"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Post Initial Comment
        uses: actions/github-script@v8
        with:
          script: |
            const { default: script } = await import(`file://${process.env.GITHUB_WORKSPACE}/scripts/ci/update-ci-comment.mjs`)
            await script({github, context, step: 'init'})

  build:
    name: Build Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci-setup
    steps:
      - uses: actions/checkout@v6
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Build Project (Production)
        run: pnpm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist-build
          path: dist/
          retention-days: 1

  # --- Stage: Quality & Security Checks (Parallel) ---

  sa-astro:
    name: "SA: Astro Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run Astro Check
        run: pnpm exec astro check | tee astro-check.log
      - name: Upload Astro Check log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: log-astro
          path: astro-check.log
          retention-days: 1

  sa-prettier:
    name: "SA: Prettier"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run Prettier check
        run: pnpm exec prettier --check . | tee prettier.log
      - name: Upload Prettier log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: log-prettier
          path: prettier.log
          retention-days: 1

  sa-eslint:
    name: "SA: ESLint"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run ESLint
        run: pnpm exec eslint . --max-warnings=0 | tee eslint.log
      - name: Upload ESLint log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: log-eslint
          path: eslint.log
          retention-days: 1

  sa-audit:
    name: "SA: Security Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run Security Audit
        run: pnpm audit --audit-level=high | tee security-audit.log
      - name: Upload Audit log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: log-audit
          path: security-audit.log
          retention-days: 1

  sa-stylelint:
    name: "SA: Stylelint"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run Stylelint
        run: pnpm exec stylelint "src/**/*.{astro,css}" | tee stylelint.log
      - name: Upload Stylelint log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: log-stylelint
          path: stylelint.log
          retention-days: 1

  sa-jsdoc:
    name: "SA: JSDoc Coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    outputs:
      coverage: ${{ steps.jsdoc_calc.outputs.coverage }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Calculate JSDoc Coverage
        id: jsdoc_calc
        run: |
          OUTPUT=$(node scripts/ci/calculate-jsdoc-coverage.mjs 2>&1 | tee jsdoc-coverage.log)
          echo "$OUTPUT"
          COVERAGE=$(echo "$OUTPUT" | sed -n 's/.*Coverage: \([0-9.]*\).*/\1/p')
          if [ -z "$COVERAGE" ]; then
            echo "::error::Failed to parse JSDoc coverage from output."
            exit 1
          fi
          echo "coverage=${COVERAGE}%" >> $GITHUB_OUTPUT
      - name: Upload JSDoc log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: log-jsdoc
          path: jsdoc-coverage.log
          retention-days: 1

  sa-lychee:
    name: "SA: Link Checker (Dist)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Restore lychee cache
        uses: actions/cache@v5
        with:
          path: .lycheecache
          key: cache-lychee-source-${{ github.sha }}
          restore-keys: cache-lychee-source-
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-build
          path: dist
      - uses: lycheeverse/lychee-action@v2.7.0
        with:
          args: --config lychee.toml --root-dir ${{ github.workspace }}/dist --format markdown --output lychee-report.md ./dist/**/*.html
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
      - name: Generate Lychee HTML Report
        if: always()
        run: node scripts/ci/generate-lychee-report.mjs
      - name: Upload Lychee reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lychee-report
          path: |
            lychee-report.md
            lychee-report.html
          retention-days: 1

  sa-typos:
    name: "SA: Spell Checker"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: crate-ci/typos@master

  sa-snyk:
    name: "SA: Snyk Security"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    outputs:
      outcome: ${{ steps.snyk.outcome }}
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: snyk/actions/node@master
        id: snyk
        if: env.SNYK_TOKEN != ''
        with:
          args: --all-projects --severity-threshold=high

  sa-sonar:
    name: "SA: SonarQube"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-build
          path: dist
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Analyze bundle size
        run: node scripts/ci/analyze-bundle-size.mjs | tee bundle-size.log
      - name: Upload bundle log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: log-bundle
          path: bundle-size.log
          retention-days: 1
      - name: Upload bundle analysis
        uses: actions/upload-artifact@v6
        with:
          name: bundle-analysis
          path: bundle-analysis.json
          retention-days: 1

  html-validator:
    name: HTML Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-build
          path: dist
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Validate HTML5
        run: |
          pnpm exec html-validate -c .htmlvalidate.json --formatter json dist | tee html-validation.log || true
          node scripts/ci/generate-html-validation-report.mjs
      - name: Upload HTML log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: log-html
          path: html-validation.log
          retention-days: 1

      - name: Upload HTML validation files
        uses: actions/upload-artifact@v6
        with:
          name: html-validation-report
          path: |
            html-validation.json
            html-report.html
          retention-days: 1

  rss-validation:
    name: RSS Feed Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-build
          path: dist
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Validate RSS feed
        run: node scripts/ci/validate-rss.mjs dist/rss.xml | tee rss-validation.log
      - name: Generate RSS preview
        run: node scripts/preview-rss.mjs
      - name: Upload RSS log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: log-rss
          path: rss-validation.log
          retention-days: 1
      - name: Upload RSS validation files
        uses: actions/upload-artifact@v6
        with:
          name: rss-validation-report
          path: |
            rss-validation.json
            dist/rss-preview.html
          retention-days: 1

  schema-validation:
    name: Schema.org JSON-LD Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-build
          path: dist
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Validate Schema.org structured data
        run: node scripts/ci/validate-schema.mjs dist | tee schema-validation.log
      - name: Generate Schema Report
        if: always()
        run: |
          if [ -f schema-report.json ]; then
            node scripts/ci/generate-schema-report.mjs
          fi
      - name: Upload Schema log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: log-schema
          path: schema-validation.log
          retention-days: 1
      - name: Upload Schema validation files
        uses: actions/upload-artifact@v6
        with:
          name: schema-validation-report
          path: |
            schema-report.json
            schema-report.html
          retention-days: 1

  image-optimization:
    name: Image Optimization Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-build
          path: dist
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Analyze images
        run: |
          echo "## 🖼️ Image Optimization Analysis" >> $GITHUB_STEP_SUMMARY
          WEBP_COUNT=$(find dist -type f -name "*.webp" | wc -l)
          echo "- WebP images: $WEBP_COUNT ✅" >> $GITHUB_STEP_SUMMARY
      - name: Generate Image HTML Report
        run: node scripts/ci/generate-image-report.mjs
      - name: Upload image report
        uses: actions/upload-artifact@v6
        with:
          name: image-optimization-report
          path: image-report.html
          retention-days: 1

  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-build
          path: dist
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright tests
        run: pnpm exec playwright test --project=functional --project=mobile-functional
      - name: Upload functional report
        uses: actions/upload-artifact@v6
        with:
          name: functional-report
          path: playwright-report/
          retention-days: 1

  accessibility:
    name: Accessibility Tests (${{ matrix.theme }} mode)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    strategy:
      matrix:
        theme: [light, dark]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-build
          path: dist
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Axe accessibility tests
        run: THEME=${{ matrix.theme }} pnpm exec playwright test --project=accessibility
      - name: Upload Axe Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: axe-accessibility-report-${{ matrix.theme }}
          path: accessibility-report/
          retention-days: 7

  lighthouse-audit:
    name: LH Audit (${{ matrix.theme }} - ${{ matrix.formFactor }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    strategy:
      matrix:
        theme: [light, dark]
        formFactor: [mobile, desktop]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-build
          path: dist
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run Lighthouse CI
        shell: bash
        env:
          FORM_FACTOR: ${{ matrix.formFactor }}
          LHCI_GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          if [ "${{ matrix.theme }}" = "dark" ]; then export LHCI_CHROME_FLAGS="--force-dark-mode --force-prefers-color-scheme=dark"; fi
          pnpm exec lhci autorun
      - name: Upload Lighthouse Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lh-results-${{ matrix.theme }}-${{ matrix.formFactor }}
          path: lighthouse-results/
          retention-days: 1

  # --- Stage: Report Aggregation ---

  static-analysis-report:
    name: Static Analysis Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      [
        sa-astro,
        sa-prettier,
        sa-eslint,
        sa-audit,
        sa-jsdoc,
        sa-lychee,
        sa-typos,
        sa-snyk,
        sa-sonar,
        ci-setup,
      ]
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Update CI Comment (SA Results)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          OUTCOME_ASTRO: ${{ needs.sa-astro.result }}
          OUTCOME_PRETTIER: ${{ needs.sa-prettier.result }}
          OUTCOME_ESLINT: ${{ needs.sa-eslint.result }}
          OUTCOME_LYCHEE: ${{ needs.sa-lychee.result }}
          OUTCOME_TYPOS: ${{ needs.sa-typos.result }}
          OUTCOME_SECURITY: ${{ needs.sa-audit.result }}
          OUTCOME_SNYK: ${{ needs.sa-snyk.result }}
          OUTCOME_SONAR: ${{ needs.sa-sonar.result }}
          OUTCOME_JSDOC: ${{ needs.sa-jsdoc.result }}
          JSDOC_COVERAGE: ${{ needs.sa-jsdoc.outputs.coverage }}
        with:
          script: |
            const { default: script } = await import(`file://${process.env.GITHUB_WORKSPACE}/scripts/ci/update-ci-comment.mjs`)
            await script({github, context, step: 'sa'})

  accessibility-report:
    name: Accessibility Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: accessibility
    if: always()
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Download Axe Results (Light)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: axe-accessibility-report-light
          path: a11y-deploy/light
      - name: Download Axe Results (Dark)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: axe-accessibility-report-dark
          path: a11y-deploy/dark
      - name: Generate Dashboard
        run: node scripts/ci/generate-accessibility-index.mjs a11y-deploy
      - name: Upload consolidated assets
        uses: actions/upload-artifact@v6
        with:
          name: a11y-dashboard
          path: a11y-deploy/
          retention-days: 1

  lighthouse-report:
    name: Lighthouse Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lighthouse-audit
    if: always()
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Download LH Results (Light - Mobile)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: lh-results-light-mobile
          path: lh-deploy/light/mobile
      - name: Download LH Results (Light - Desktop)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: lh-results-light-desktop
          path: lh-deploy/light/desktop
      - name: Download LH Results (Dark - Mobile)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: lh-results-dark-mobile
          path: lh-deploy/dark/mobile
      - name: Download LH Results (Dark - Desktop)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: lh-results-dark-desktop
          path: lh-deploy/dark/desktop
      - name: Generate Dashboard
        run: node scripts/ci/generate-lighthouse-index.mjs lh-deploy
      - name: Upload LH Dashboard
        uses: actions/upload-artifact@v6
        with:
          name: lh-dashboard
          path: lh-deploy/
          retention-days: 1

  deploy-reports:
    name: "🚀 Deploy CI Dashboard"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      [
        ci-setup,
        sa-astro,
        sa-prettier,
        sa-eslint,
        sa-audit,
        sa-jsdoc,
        sa-lychee,
        sa-typos,
        sa-snyk,
        sa-sonar,
        accessibility-report,
        bundle-size,
        html-validator,
        rss-validation,
        schema-validation,
        image-optimization,
        lighthouse-report,
        functional-tests,
      ]
    if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Download Accessibility Dashboard
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: a11y-dashboard
          path: a11y-deploy
      - name: Download Lighthouse Dashboard
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: lh-dashboard
          path: lh-deploy
      - name: Download HTML Validation
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: html-validation-report
          path: .
      - name: Download RSS Preview
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: rss-validation-report
          path: .
      - name: Download Schema Report
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: schema-validation-report
          path: .
      - name: Download Image Report
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: image-optimization-report
          path: .
      - name: Download Bundle Stats
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: bundle-analysis
          path: .
      - name: Download Lychee Report
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: lychee-report
          path: .
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Capture Workflow Graph
        run: node scripts/ci/capture-workflow-graph.mjs
        continue-on-error: true
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Download Logs
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: log-*
          path: logs
          merge-multiple: true
      - name: Build Dashboard
        run: node scripts/ci/build-report-dashboard.mjs
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OUTCOME_ASTRO: ${{ needs.sa-astro.result }}
          OUTCOME_PRETTIER: ${{ needs.sa-prettier.result }}
          OUTCOME_ESLINT: ${{ needs.sa-eslint.result }}
          OUTCOME_LYCHEE: ${{ needs.sa-lychee.result }}
          OUTCOME_TYPOS: ${{ needs.sa-typos.result }}
          OUTCOME_SECURITY: ${{ needs.sa-audit.result }}
          OUTCOME_SNYK: ${{ needs.sa-snyk.result }}
          OUTCOME_SONAR: ${{ needs.sa-sonar.result }}
          OUTCOME_JSDOC: ${{ needs.sa-jsdoc.result }}
          OUTCOME_STYLELINT: ${{ needs.sa-stylelint.result }}
          OUTCOME_A11Y: ${{ needs.accessibility-report.result }}
          OUTCOME_HTML: ${{ needs.html-validator.result }}
          OUTCOME_BUNDLE: ${{ needs.bundle-size.result }}
          OUTCOME_RSS: ${{ needs.rss-validation.result }}
          OUTCOME_SCHEMA: ${{ needs.schema-validation.result }}
          OUTCOME_IMAGE: ${{ needs.image-optimization.result }}
          OUTCOME_FUNCTIONAL: ${{ needs.functional-tests.result }}
      - name: Deploy to Vercel
        id: deploy
        run: |
          export VERCEL_TOKEN=${{ secrets.VERCEL_TOKEN }}
          IS_PROD=${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
          DEPLOY_URL=$(npx vercel deploy ./dist-reports --name jmrp-ci-reports --token=${{ secrets.VERCEL_TOKEN }} --yes --public $IS_PROD)
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
      - name: Update CI Comment (Final Results)
        uses: actions/github-script@v8
        env:
          VERCEL_URL: ${{ steps.deploy.outputs.url }}
          OUTCOME_ASTRO: ${{ needs.sa-astro.result }}
          OUTCOME_PRETTIER: ${{ needs.sa-prettier.result }}
          OUTCOME_ESLINT: ${{ needs.sa-eslint.result }}
          OUTCOME_LYCHEE: ${{ needs.sa-lychee.result }}
          OUTCOME_TYPOS: ${{ needs.sa-typos.result }}
          OUTCOME_SECURITY: ${{ needs.sa-audit.result }}
          OUTCOME_SNYK: ${{ needs.sa-snyk.result }}
          OUTCOME_SONAR: ${{ needs.sa-sonar.result }}
          OUTCOME_JSDOC: ${{ needs.sa-jsdoc.result }}
          OUTCOME_STYLELINT: ${{ needs.sa-stylelint.result }}
          JSDOC_COVERAGE: ${{ needs.sa-jsdoc.outputs.coverage }}
          OUTCOME_A11Y: ${{ needs.accessibility-report.result }}
          OUTCOME_HTML: ${{ needs.html-validator.result }}
          OUTCOME_BUNDLE: ${{ needs.bundle-size.result }}
          OUTCOME_RSS: ${{ needs.rss-validation.result }}
          OUTCOME_SCHEMA: ${{ needs.schema-validation.result }}
          OUTCOME_IMAGE: ${{ needs.image-optimization.result }}
          OUTCOME_FUNCTIONAL: ${{ needs.functional-tests.result }}
        with:
          script: |
            const { default: script } = await import(`file://${process.env.GITHUB_WORKSPACE}/scripts/ci/update-ci-comment.mjs`)
            await script({github, context, step: 'final'})
