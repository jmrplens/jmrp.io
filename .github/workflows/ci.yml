name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 9 * * 1"

concurrency:
  group: ${{ github.workflow }}$-{{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Astro Check
        run: pnpm exec astro check
      - name: Prettier Check
        run: pnpm exec prettier --check .
      - name: Security Audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

  link-checker:
    name: Link Checker (Lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore lychee cache
        uses: actions/cache@v5
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-
      - name: Check Links
        uses: lycheeverse/lychee-action@v2.7.0
        with:
          args: >-
            --cache 
            --max-cache-age 1d 
            --verbose 
            --no-progress 
            --exclude 'https://mstdn.jmrp.io'
            --exclude 'https://electronica-submarina.com'
            --exclude 'https://ies-berlanga.info'
            --exclude 'https://www.i3m-detectors.i3m.upv.es'
            './**/*.md' 
            './**/*.mdx' 
            './**/*.html' 
            './src/**/*.astro' 
            './src/**/*.ts'
            './src/**/*.tsx'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}

  spell-checker:
    name: Spell Checker (Typos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Spelling
        uses: crate-ci/typos@master

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: SonarCloud Scan
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}

  snyk-security:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run Snyk to check for vulnerabilities
        if: ${{ secrets.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
        continue-on-error: true

  build:
    name: Build Artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Build Project (Production)
        run: pnpm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist-build
          path: dist/
          retention-days: 1

  accessibility:
    name: Accessibility Tests (${{ matrix.theme }} mode)
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        theme: [light, dark]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-build
          path: dist
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Axe accessibility tests
        run: THEME=${{ matrix.theme }} pnpm exec playwright test --project=accessibility
      - name: Upload Axe Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: axe-accessibility-report-${{ matrix.theme }}
          path: accessibility-report/
          retention-days: 7

  accessibility-report:
    name: Accessibility Report
    runs-on: ubuntu-latest
    needs: accessibility
    if: always()
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline

      # Download artifacts
      - name: Download Axe Results (Light)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: axe-accessibility-report-light
          path: a11y-deploy/light
      - name: Download Axe Results (Dark)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: axe-accessibility-report-dark
          path: a11y-deploy/dark

      - name: Generate Dashboard
        run: node scripts/ci/generate-accessibility-index.mjs a11y-deploy

      - name: Deploy to Surge
        if: github.event_name == 'pull_request' && secrets.SURGE_TOKEN != ''
        run: |
          pnpm exec surge ./a11y-deploy jmrp-a11y-pr-${{ github.event.number }}.surge.sh --token ${{ secrets.SURGE_TOKEN }}

      - name: Format Report for Comment
        run: node scripts/ci/format-accessibility-report.mjs a11y-deploy > accessibility_comment.md

      - name: Post Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          SURGE_URL: jmrp-a11y-pr-${{ github.event.number }}.surge.sh
        with:
          script: |
            const fs = require('fs');
            const commentFile = 'accessibility_comment.md';

            try {
              if (fs.existsSync(commentFile)) {
                let comment = fs.readFileSync(commentFile, 'utf8');
                const surgeUrl = process.env.SURGE_URL;
                if (surgeUrl) {
                  comment += `\n\n#### 🌐 Live Report\n> 🚀 [**Open Accessibility Reports Dashboard**](https://${surgeUrl}) for detailed insights.`;
                }
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment,
                });
              } else {
                console.log("Comment file not found, skipping.");
              }
            } catch (error) {
              console.error("Failed to post accessibility comment:", error);
            }

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-build
          path: dist
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Analyze bundle size
        run: node scripts/ci/analyze-bundle-size.mjs
      - name: Post Bundle Size Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/post-bundle-size-comment.mjs`)
            await script({github, context})

  release-drafter:
    name: Update Release Draft
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}

  html-validator:
    name: HTML Validation
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-build
          path: dist
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Validate HTML5
        run: |
          # Generate JSON report for automated processing
          pnpm exec html-validate -c .htmlvalidate.json --formatter json dist > html-validation.json || true

          # Create the interactive HTML report and exit with error if issues are found
          node scripts/ci/generate-html-validation-report.mjs
      - name: Deploy HTML Report to Surge
        if: github.event_name == 'pull_request' && secrets.SURGE_TOKEN != ''
        shell: bash
        run: |
          mkdir -p html-deploy
          cp html-report.html html-deploy/index.html
          pnpm exec surge ./html-deploy jmrp-html-pr-${{ github.event.number }}.surge.sh --token ${{ secrets.SURGE_TOKEN }}
      - name: Post HTML Validation Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          SURGE_URL: jmrp-html-pr-${{ github.event.number }}.surge.sh
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/post-html-validation-comment.mjs`)
            await script({github, context})

  rss-validation:
    name: RSS Feed Validation
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-build
          path: dist
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Validate RSS feed
        run: node scripts/ci/validate-rss.mjs dist/rss.xml
      - name: Generate RSS preview
        run: node scripts/preview-rss.mjs
      - name: Upload RSS preview artifact
        uses: actions/upload-artifact@v6
        with:
          name: rss-preview
          path: dist/rss-preview.html
          retention-days: 3
      - name: Deploy RSS Preview to Surge
        if: github.event_name == 'pull_request' && secrets.SURGE_TOKEN != ''
        shell: bash
        run: |
          mkdir -p preview-deploy
          cp dist/rss-preview.html preview-deploy/index.html
          pnpm exec surge ./preview-deploy jmrp-rss-pr-${{ github.event.number }}.surge.sh --token ${{ secrets.SURGE_TOKEN }}
      - name: Post RSS Validation Comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v8
        env:
          SURGE_URL: jmrp-rss-pr-${{ github.event.number }}.surge.sh
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/post-rss-validation-comment.mjs`)
            await script({github, context})

  schema-validation:
    name: Schema.org JSON-LD Validation
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-build
          path: dist
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Validate Schema.org structured data
        run: node scripts/ci/validate-schema.mjs dist
      - name: Generate Schema Report
        if: always()
        run: |
          if [ -f schema-report.json ]; then
            echo "schema-report.json found. Generating HTML report..."
            node scripts/ci/generate-schema-report.mjs
          else
            echo "schema-report.json not found. Skipping generation."
          fi
      - name: Deploy Schema Report to Surge
        if: github.event_name == 'pull_request' && always() && secrets.SURGE_TOKEN != ''
        run: |
          if [ -f schema-report.html ]; then
            mkdir -p schema-deploy
            cp schema-report.html schema-deploy/index.html
            pnpm exec surge ./schema-deploy jmrp-schema-pr-${{ github.event.number }}.surge.sh --token ${{ secrets.SURGE_TOKEN }}
          fi
      - name: Format Schema Comment
        if: github.event_name == 'pull_request' && always()
        run: |
          if [ -f schema-report.json ]; then
            node scripts/ci/format-schema-report.mjs schema-report.json > schema_comment.md
          fi
      - name: Post Schema Validation Comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v8
        env:
          SURGE_URL: jmrp-schema-pr-${{ github.event.number }}.surge.sh
        with:
          script: |
            const fs = require('fs');
            const commentFile = 'schema_comment.md';

            try {
              if (fs.existsSync(commentFile)) {
                let comment = fs.readFileSync(commentFile, 'utf8');
                const surgeUrl = process.env.SURGE_URL;
                
                if (surgeUrl && /^jmrp-schema-pr-\d+\.surge\.sh$/.test(surgeUrl)) {
                  comment += `\n\n#### 🌐 Live Report\n> 🚀 [**Open Schema Validation Report**](https://${surgeUrl}) for detailed insights.`;
                } else if (surgeUrl) {
                   console.warn('Skipping live report link due to invalid SURGE_URL format:', surgeUrl);
                }

                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment,
                });
              } else {
                console.log("Comment file not found (validation might have failed completely), posting fallback.");
                // Optional: Post fallback
              }
            } catch (e) {
              core.setFailed(`Failed to post schema validation comment: ${e.message}`);
            }

  image-optimization:
    name: Image Optimization Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-build
          path: dist
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Analyze images
        run: |
          echo "## 🖼️ Image Optimization Analysis" >> $GITHUB_STEP_SUMMARY
          WEBP_COUNT=$(find dist -type f -name "*.webp" | wc -l)
          echo "- WebP images: $WEBP_COUNT ✅" >> $GITHUB_STEP_SUMMARY
      - name: Generate Image HTML Report
        run: node scripts/ci/generate-image-report.mjs
      - name: Deploy Image Report to Surge
        if: github.event_name == 'pull_request' && secrets.SURGE_TOKEN != ''
        shell: bash
        run: |
          mkdir -p img-deploy
          cp image-report.html img-deploy/index.html
          pnpm exec surge ./img-deploy jmrp-img-pr-${{ github.event.number }}.surge.sh --token ${{ secrets.SURGE_TOKEN }}
      - name: Post Image Optimization Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          SURGE_URL: jmrp-img-pr-${{ github.event.number }}.surge.sh
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/post-image-optimization-comment.mjs`)
            await script({github, context})

  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-build
          path: dist
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright tests
        run: pnpm exec playwright test --project=functional --project=mobile-functional
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: functional-test-report
          path: playwright-report/
          retention-days: 7
      - name: Deploy Playwright Report to Surge
        if: github.event_name == 'pull_request' && always() && secrets.SURGE_TOKEN != ''
        shell: bash
        run: |
          pnpm exec surge ./playwright-report jmrp-functional-pr-${{ github.event.number }}.surge.sh --token ${{ secrets.SURGE_TOKEN }}
      - name: Post Functional Test Comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v8
        env:
          SURGE_URL: jmrp-functional-pr-${{ github.event.number }}.surge.sh
        with:
          script: |
            const { default: script } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/post-functional-test-comment.mjs`)
            await script({github, context})

  lighthouse-audit:
    name: LH Audit (${{ matrix.theme }} - ${{ matrix.formFactor }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        theme: [light, dark]
        formFactor: [mobile, desktop]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-build
          path: dist
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run Lighthouse CI
        shell: bash
        env:
          FORM_FACTOR: ${{ matrix.formFactor }}
          LHCI_GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          if [ "${{ matrix.theme }}" = "dark" ]; then export LHCI_CHROME_FLAGS="--force-dark-mode --force-prefers-color-scheme=dark"; fi
          pnpm exec lhci autorun
      - name: Upload Lighthouse Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lh-results-${{ matrix.theme }}-${{ matrix.formFactor }}
          path: lighthouse-results/
          retention-days: 1

  lighthouse-report:
    name: Lighthouse Report
    runs-on: ubuntu-latest
    needs: lighthouse-audit
    if: always()
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile --prefer-offline

      # Download artifacts for each combination and place in structure
      - name: Download LH Results (Light - Mobile)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: lh-results-light-mobile
          path: lh-deploy/light/mobile
      - name: Download LH Results (Light - Desktop)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: lh-results-light-desktop
          path: lh-deploy/light/desktop
      - name: Download LH Results (Dark - Mobile)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: lh-results-dark-mobile
          path: lh-deploy/dark/mobile
      - name: Download LH Results (Dark - Desktop)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: lh-results-dark-desktop
          path: lh-deploy/dark/desktop

      - name: Generate Dashboard
        run: node scripts/ci/generate-lighthouse-index.mjs lh-deploy

      - name: Deploy to Surge
        if: github.event_name == 'pull_request' && secrets.SURGE_TOKEN != ''
        run: |
          pnpm exec surge ./lh-deploy jmrp-lh-pr-${{ github.event.number }}.surge.sh --token ${{ secrets.SURGE_TOKEN }}

      - name: Format Report for Comment
        run: |
          # The format script now scans recursively
          node scripts/ci/format-lighthouse-report.js lh-deploy > lighthouse_comment.md

      - name: Post Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          SURGE_URL: jmrp-lh-pr-${{ github.event.number }}.surge.sh
        with:
          script: |
            const fs = require('fs');
            const commentFile = 'lighthouse_comment.md';
            if (fs.existsSync(commentFile)) {
              let comment = fs.readFileSync(commentFile, 'utf8');
              const surgeUrl = process.env.SURGE_URL;
              if (surgeUrl) {
                comment += `\n\n#### 🌐 Live Report\n> 🚀 [**Open Lighthouse Reports Dashboard**](https://${surgeUrl}) for detailed insights.`;
              }
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment,
              });
            }
