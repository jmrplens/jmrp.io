# Copilot Coding Agent Setup Steps
# https://docs.github.com/en/copilot/how-tos/agents/copilot-coding-agent/customizing-the-development-environment-for-copilot-coding-agent
#
# This workflow runs automatically when Copilot Coding Agent starts working
# on a task. It pre-installs dependencies and browsers so the agent can
# build and test the project immediately.

name: "Copilot Setup Steps"

on:
  push:
    paths:
      - ".github/workflows/copilot-setup-steps.yml"

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: "Install Playwright browsers"
        run: pnpm exec playwright install --with-deps chromium

      - name: "Verify environment"
        run: |
          pnpm typecheck
          pnpm exec astro build
