name: Setup pnpm + Node
description: Checkout deps setup shared by all jobs

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v6
      with:
        node-version-file: package.json
        cache: pnpm
    - run: pnpm install --frozen-lockfile --prefer-offline
      shell: bash
