# Localized fallback only — the homepage actually renders
# `pages.home.heroTitle` / `heroSubtitle` / `heroBio1` / `heroBio2` from the
# i18n layer (see HomePage.astro and utils/llms.ts). Kept in sync with the
# English strings there so the two copies never state different facts.
hero:
  title: "Hi, I'm José Manuel."
  subtitle: "Embedded Firmware & Software Engineer. <br>Bridging the gap between <strong>firmware</strong>, software, and applied research."
  bio:
    - "I'm José Manuel Requena Plens, an R&D engineer based in Valencia, Spain, specializing in <strong>embedded firmware</strong> (C/C++, STM32/ESP32), <strong>industrial software development</strong>, and <strong>applied acoustics research</strong>. Between 2023 and 2026 I built firmware for solar inverters on STM32 and FreeRTOS; before that, four years of predoctoral research at the UPV (2019–2023) produced 14 academic publications."
    - "The open-source side is the measurable one: 38 public repositories on GitHub with more than 350 stars between them (August 2026), two MCP servers pulled more than 7,500 times from Docker Hub, and more than 15 papers, theses and releases archived with a DOI on Zenodo. My homelab serves this site and the <a href='https://mcp.jmrp.io/' target='_blank' rel='external noopener noreferrer' class='external-link' aria-label='public MCP servers (opens in new tab)'>public MCP servers</a> anyone can point an AI client at. <a href='/cv/'>Check out my CV</a> to see the full journey."

