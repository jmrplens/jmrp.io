# Person Schema defaults for JSON-LD
person:
  name: "José Manuel Requena Plens"
  # Name variants emitted as Person `alternateName`, so an engine indexing a
  # paper, a profile or a repo under a different spelling still resolves to
  # this entity. Every entry below was OBSERVED in the wild — none invented:
  # a wrong or speculative variant makes the entity fuzzier, not richer.
  # The `name` above stays the single canonical form.
  alternateName:
    - "jmrplens" # handle: GitHub, Mastodon, ORCID other-name
    - "José M. Requena-Plens" # citation form in every entry of papers.bib
    - "Jose M. Requena-Plens" # ASCII fold of the citation form
    - "José M. Requena Plens" # Mastodon display name
    - "Jose M. Requena Plens" # Bluesky display name
    - "José Manuel Requena-Plens" # hyphenated form of the canonical name
    - "Jose Manuel Requena-Plens" # ASCII fold of the above
    - "Jose Manuel Requena Plens" # ASCII fold of the canonical name
  # Non-localized fallback only — the canonical, localized jobTitle is sourced
  # from `src/content/profile/about.yaml` (`person.jobTitle[locale]`) by
  # BaseHead.astro. This value is used solely if that entry is unavailable.
  jobTitle: "R&D · Firmware & Software Engineer"
  # Canonical academic/identity profiles for JSON-LD `sameAs` (not shown as footer icons).
  # Merged with `social_links` to strengthen AI entity recognition.
  sameAs:
    - "https://scholar.google.com/citations?user=9b0kPaUAAAAJ"
    - "https://orcid.org/0000-0003-1250-6212"
    - "https://www.researchgate.net/profile/Jose-Requena-Plens-2"
    - "https://www.mathworks.com/matlabcentral/profile/authors/5890853"
    # Forge accounts whose ownership is asserted by a signed `proof@ariadne.id`
    # notation in the OpenPGP key 0A993B26…91FC — the strongest ownership
    # evidence any profile here has.
    #
    # Verify against the key served over WKD (openpgpkey.jmrp.io, what Keyoxide
    # reads), NOT against keys.openpgp.org: that keyserver still holds an older
    # upload carrying a seventh, now-dead keybase.io proof that the current key
    # no longer declares.
    - "https://codeberg.org/jmrplens"
    - "https://gitlab.com/jmrp"
    # Package registries where the software in `owns` is published, tying the
    # identity to the artifacts rather than only to their source repos.
    - "https://pypi.org/user/jmrplens/"
    - "https://hub.docker.com/u/jmrplens"
    # AT Protocol forge, published under the same handle as the Bluesky
    # profile above. Ownership is not asserted here but PROVEN by the
    # protocol: tangled.org/jmrp.io resolves to did:plc:jder4wkjnwh6mzhrx4n5ebti,
    # the very DID that bsky.app/profile/jmrp.io resolves to (checked
    # 2026-08-27), so both are the same account seen through two apps.
    - "https://tangled.org/jmrp.io"
  # Expertise topics emitted as the canonical Person `knowsAbout`, site-wide, by
  # BaseHead.astro. Merged from the former site-config list + about.yaml's
  # embedded-firmware specifics so a single list covers the whole entity —
  # page builders must NOT redefine `knowsAbout` locally (see CLAUDE.md GEO
  # audit notes). Terms with a verified Wikidata Q-id are rendered as `Thing`
  # objects by BaseHead; the rest stay as plain strings (mixing is valid).
  knowsAbout:
    - "Embedded Systems"
    - "Firmware"
    - "STM32"
    - "FreeRTOS"
    - "Modbus"
    - "Cryptography"
    - "Network Security"
    - "Nginx"
    - "MikroTik RouterOS"
    - "WireGuard"
    - "IPv6"
    - "Acoustics"
    - "Signal Processing"
    - "Go"
    - "Model Context Protocol"
    - "CI/CD"
    - "DevSecOps"
    - "Software Testing"
    - "ESP32"

