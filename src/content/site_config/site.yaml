hero:
  title: "Hi, I'm José Manuel."
  subtitle: "Software Engineer & Researcher. <br>Bridging the gap between <strong>Acoustics</strong>, <strong>Electronics</strong>, and <strong>Code</strong>."
  bio:
    - "I'm José Manuel Requena Plens, an R&D engineer based in Valencia, Spain, specializing in <strong>embedded firmware</strong> (C/C++, STM32/ESP32), <strong>industrial software development</strong>, and <strong>applied acoustics research</strong>. I've worked on projects across very different domains —from <strong>academic research</strong> to <strong>industrial development</strong>— and that diversity is what motivates me the most."
    - "I thrive on the challenge of integrating hardware and software. When I'm not coding industrial systems, I'm an active <strong>Open Source</strong> contributor and a passionate self-hoster, constantly refining my homelab and building tools for the community. <a href='/cv/'>Check out my CV</a> to see the full journey."

