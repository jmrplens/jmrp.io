    items:
      - name: gitlab-mcp-server
        tech: Go · Servidor Model Context Protocol
        icon: logos:go
        description: >-
          Servidor MCP de GitLab de código abierto que expone más de 1.000
          operaciones a asistentes de IA mediante un diseño dinámico de 2
          herramientas (find/execute), con transportes stdio/HTTP/OAuth y modos
          seguro y de solo lectura.
        metrics: ["Listado en Glama, mcp.so, Cursor y mcpservers.org"]
        links:
          - {
              label: GitHub,
              url: https://github.com/jmrplens/gitlab-mcp-server,
