- title: Experiencia
  type: time_table
  contents:
    - title: Desarrollador de Software I+D
      institution: Power Electronics (<a href="https://power-electronics.com/en" aria-label="PE - Power Electronics website">PE</a>)
      department: Solar + Storage (<a href="https://power-electronics.com/en/solar" aria-label="PE Solar - Power Electronics Solar & Storage division">PE Solar</a>)
      location: Llíria, España
      year: Abr 2023 - May 2026
      summary: >
        Desarrollo de firmware para inversores solares y sistemas de control en plantas fotovoltaicas, trabajando sobre microcontroladores STM32 con entornos bare-metal y RTOS.
        <br><br>
        Contribuciones clave:
      description:
        - "Optimización del sistema de archivos embebido, reduciendo tiempos de acceso y mejorando la estabilidad en operación continua."
        - "Mejora del rendimiento en comunicaciones TCP, reduciendo latencia y aumentando la robustez del stack de red."
        - "Optimización de tareas en STM32: reducción de consumo de stack y heap, y ajuste de ciclos de CPU para mejorar el rendimiento en tiempo real."
        - "Implementación y mantenimiento de comunicaciones industriales: Modbus RTU/TCP, UART, I2C y SPI."
        - "Desarrollo en C con capas HAL y gestión de periféricos de bajo nivel."
        - "Automatización de pruebas sobre hardware real mediante Python, incluyendo tests unitarios, de integración y de estrés."

    - title: Investigador predoctoral
      institution: Universitat Politècnica de València (<a href="https://www.upv.es/index-es.html" aria-label="UPV - Universitat Politècnica de València">UPV</a>) + Consejo Superior de Investigaciones Científicas (<a href="https://www.csic.es/es" aria-label="CSIC - Consejo Superior de Investigaciones Científicas">CSIC</a>) + Hospital La Fe (<a href="https://www.iislafe.es/" aria-label="IIS - Instituto de Investigación Sanitaria La Fe">IIS</a>)
      department: Sistemas de Imagen y Terapia Médica (<a href="https://i3m.csic.upv.es/" aria-label="i3M - Instituto de Investigación">i3M</a>)
      year: Ene 2023 - Abr 2023
      location: Valencia, España
      summary: >
        Investigador en la línea de I+D: <b>Metamateriales acústicos para tratamientos de histotricia por ultrasonidos</b>.
        <br><br>
        <b>Proyecto</b>: Nueva generación de metasuperficies inteligentes basadas en fabricación aditiva para aplicaciones estratégicas en telecomunicaciones (Metasmart). Financiado por la Agencia Valenciana de Innovación (Referencia: INNEST/2022/345).
        <br><br>
        Algunas tareas planificadas:
      description:
        - Diseño de lentes acústicas de enfoque ultra-cercano.
        - Fabricación de prototipos.
        - Experimentación con tejidos ex-vivo.

    - title: Investigador predoctoral
      institution: Universitat Politècnica de València (<a href="https://www.upv.es/index-es.html" aria-label="UPV - Universitat Politècnica de València">UPV</a>) + Consejo Superior de Investigaciones Científicas (<a href="https://www.csic.es/es" aria-label="CSIC - Consejo Superior de Investigaciones Científicas">CSIC</a>)
      department: Sistemas de Imagen y Terapia Médica (<a href="https://i3m.csic.upv.es/" aria-label="i3M - Instituto de Investigación">i3M</a>)
      year: Jul 2021 - Jul 2022
      location: Valencia, España
      summary: >
        El objetivo principal es la investigación y desarrollo de metamateriales acústicos para su uso en aplicaciones arquitectónicas e imagen médica.
        <br><br>
        Objetivos alcanzados:
      description:
        - Desarrollo teórico de metadifusores acústicos basados en membranas o placas reduciendo el tamaño de los difusores comerciales.
        - Simulación de los difusores acústicos y validación de resultados (MATLAB y COMSOL).
        - title: "Dos publicaciones en congresos nacionales e internacionales:"
          contents:
            - Tecniacústica - <a href="/pdf/paper-resources/Conferences/Tecniacustica/JimenezTEC2020a.pdf">Beyond Schroeder diffusers using acoustic metasurfaces</a>.
            - Euronoise - <a href="/pdf/paper-resources/Conferences/Euronoise/plensEuro2021_2.pdf">Sound diffusing metasurfaces based on elastic plates and membranes</a>
        - Desarrollo y simulación de guías de ondas basadas en metamateriales para mejorar la resolución ultrasónica en aire.
        - Fabricación de prototipos de guías de ondas.
        - Resultados experimentales validados frente a los obtenidos en simulación.
        - Tutor del Trabajo Final de Máster de un estudiante del Máster en Ingeniería Acústica de la UPV.

    - title: Investigador en proyecto europeo
      institution: Escuela Politécnica Superior de Gandía (<a href="https://www.upv.es/entidades/epsg/home/" aria-label="UPV - Campus de Gandía">UPV</a>) + Agencia Espacial Europea (<a href="https://www.esa.int/" aria-label="ESA - Agencia Espacial Europea">ESA</a>)
      department: Grupo de Acústica de Medios Complejos del IGIC (<a href="https://igic.webs.upv.es/" aria-label="IGIC - Instituto de Investigación para la Gestión Integrada de zonas Costeras">IGIC</a>)
      year: Feb 2020 - Jul 2021
      location: Gandía, España
      summary:
        "Implementar y validar experimentalmente un método de mitigación del sonido, aplicable a una configuración real de vehículo de lanzamiento espacial (VEGA), que resulte en una disminución significativa de los niveles de presión sonora generados en el área de lanzamiento durante el despegue.
        <br><br>
        Proyecto financiado por la ESA (Agencia Espacial Europea) con referencia ESA AO/1-9479/18/NL/LvH, en colaboración con: CNRS/Laboratoire d'Acoustique de la Université du Mans; COMET Ingeniería; Consejo Superior de Investigaciones Científicas (CSIC) y Universidad Politécnica de Madrid.
        <br><br>
        Todos los objetivos del proyecto se completaron al 100%:"
      description:
        - Diseño de la geometría óptima del metamaterial acústico para reducir los niveles de ruido.
        - Simulación de un entorno real para validar el rendimiento del diseño (MATLAB, COMSOL y Python).
        - Diseño del modelo industrial para la fabricación del prototipo mediante inyección de plástico.
        - Desarrollo de software para mediciones acústicas según las normas ISO 10534-2:1998 y ASTM 2611-19. <a href="https://github.com/jmrplens/A-Lab">A|Lab</a>
        - 'Diseño y desarrollo de un sistema robótico de 3 ejes para realizar mediciones experimentales. Fotos e información aquí: <a href="https://cienciagandia.webs.upv.es/en/2022/03/metamaterial-to-reduce-noise-in-space-rocket-launches/" aria-label="NEWS - Proyecto de metamateriales para lanzamientos de cohetes espaciales">NEWS</a>'
        - Resultados validados y aceptados por la ESA.
        - title: "Tres publicaciones/presentaciones en congresos internacionales (Euronoise y ECSSMET) y una en congreso nacional (Tecniacústica):"
          contents:
            - Euronoise - <a href="/pdf/paper-resources/Conferences/Euronoise/plensEuro2021.pdf">Perfect broadband sound absorber metamaterial for noise reduction in a rocket launch</a>.
            - Euronoise - <a href="/pdf/paper-resources/Conferences/Euronoise/EscartiEuro2021.pdf">Application of metamaterials to control noise scattering during space vehicle lift-off</a>.
            - "ECSSMET - Launch sound level characterisation and mitigation: numerical modelling framework and metamaterial proof of concept."
            - Tecniacústica - <a href="/pdf/paper-resources/Conferences/Tecniacustica/plensTEC2020.pdf">Acoustic field prediction during the launch of rockets</a>.

    - title: Prácticas de investigación
      institution: Universidad de Alicante (<a href="https://www.ua.es/es/index.html" aria-label="UA - Universidad de Alicante">UA</a>)
      department: Dep. de Física, Ingeniería de Sistemas y Teoría de la Señal (<a href="https://dfests.ua.es/" aria-label="DFESTS - Departamento de la UA">DFESTS</a>)
      year: Feb 2018 - Jul 2018
      location: Alicante, España
      summary:
        'Prácticas en diferentes proyectos de investigación en el <a href="https://iufacyt.ua.es/es/grupos-de-investigacion/acustica-aplicada.html" aria-label="Grupo de Acústica Aplicada de la UA">Grupo de Acústica Aplicada</a>, perteneciente al Instituto Universitario de Física Aplicada a las Ciencias y las Tecnologías de la Escuela Politécnica Superior de Alicante.
        <br><br>
        Objetivos alcanzados:'
      description:
        - Simulación de modelos acústicos.
        - Mediciones acústicas mediante un sistema robótico controlado por LabView.
        - 'Investigación de la eficiencia de radiación acústica (ruido de origen vibratorio) de placas metálicas para un estudio inicial de las emisiones sonoras de buques en agua. Realizado en colaboración con <a href="https://electronica-submarina.com/" aria-label="SAES - Electrónica Submarina">SAES</a>, aquí se puede leer una noticia al respecto: <a href="https://electronica-submarina.com/2018/11/05/saes-latest-researches-on-underwater-noise-by-ships-are-presented-at-tecniacustica/" aria-label="NEWS - Investigación sobre ruido submarino de buques">NEWS</a>.'
        - title: "Una publicación en congreso nacional:"
          contents:
            - Tecniacústica - <a href="/pdf/paper-resources/Conferences/Tecniacustica/saura2018.pdf">Comportamiento vibroacústico de contenedores cilíndricos en aire</a>.

    - title: Fundador y Vocal
      institution: AmicroTech (<a href="https://www.linkedin.com/company/a-µtech/" aria-label="AµTech - Perfil de LinkedIn de AmicroTech">AµTech</a>)
      department: Universidad de Alicante (<a href="https://www.ua.es/es/index.html" aria-label="UA - Universidad de Alicante">UA</a>)
