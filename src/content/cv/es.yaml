        icon: logos:python
        description: >-
          Biblioteca de filtrado por bandas de octava y fracciones de octava para
          señales en el dominio del tiempo, publicada en PyPI.
        metrics: [PyPI]
        links:
          - { label: GitHub, url: https://github.com/jmrplens/PyOctaveBand }
