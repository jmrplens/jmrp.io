sections:
  - kind: experience
    title: Experiencia
    items:
      - role: Desarrollador de Software I+D
        org:
          - {
              name: Power Electronics,
              short: PE,
              url: https://power-electronics.com/en,
            }
        department:
          {
            name: Solar + Storage,
            short: PE Solar,
            url: https://power-electronics.com/en/solar,
          }
        location: Llíria, España
        period: Abr 2023 - May 2026
        summary: >-
          Desarrollo de firmware para inversores solares y sistemas de control en
          plantas fotovoltaicas, trabajando sobre microcontroladores STM32 con
          entornos bare-metal y RTOS.
        bullets:
          - >-
            Reduje el consumo de stack de las tareas sobre RTOS entre un 30% y un
            50%, optimizando el uso de memoria en los STM32.
          - >-
            Optimicé el manejo de peticiones Modbus TCP, reduciendo el uso de CPU
            bajo carga (40.000 peticiones/s) del 80% al 17% sin pérdida de
            respuestas.
          - >-
            Mejoré la estabilidad del sistema de archivos embebido, reduciendo los
            tiempos de acceso en operación continua.
          - >-
            Implementé y mantuve comunicaciones industriales en C con capas de
            abstracción de hardware (HAL): Modbus RTU/TCP, UART, I2C y SPI.
          - >-
            Automaticé miles de pruebas unitarias (Ceedling) y de integración sobre
            hardware real (pytest): rendimiento TCP/FTP y seguridad FTP.
          - >-
            Revisé los merge requests del equipo, detectando bugs y proponiendo
            mejoras antes de su integración.
        ats:
          normal: true
          org: Power Electronics — Solar + Storage

      - role: Investigador predoctoral
        org:
          - {
              name: Universitat Politècnica de València,
              short: UPV,
              url: https://www.upv.es/index-es.html,
            }
          - {
              name: Consejo Superior de Investigaciones Científicas,
              short: CSIC,
              url: https://www.csic.es/es,
            }
          - { name: Hospital La Fe, short: IIS, url: https://www.iislafe.es/ }
        department:
          {
            name: Sistemas de Imagen y Terapia Médica,
            short: i3M,
            url: https://i3m.csic.upv.es/,
          }
        location: Valencia, España
        period: Ene 2023 - Abr 2023
        summary: >-
          Investigador en la línea de I+D: **Metamateriales acústicos para
          tratamientos de histotricia por ultrasonidos**.
        notes:
          - >-
            **Proyecto**: Nueva generación de metasuperficies inteligentes basadas
            en fabricación aditiva para aplicaciones estratégicas en
            telecomunicaciones (Metasmart). Financiado por la Agencia Valenciana de
            Innovación (Referencia: INNEST/2022/345).
        bullets:
          - Diseño de lentes acústicas de enfoque ultra-cercano.
          - Fabricación de prototipos.
          - Experimentación con tejidos ex-vivo.
        ats: { normal: false }

      - role: Investigador predoctoral
        org:
          - {
              name: Universitat Politècnica de València,
              short: UPV,
              url: https://www.upv.es/index-es.html,
            }
          - {
              name: Consejo Superior de Investigaciones Científicas,
              short: CSIC,
              url: https://www.csic.es/es,
            }
        department:
          {
            name: Sistemas de Imagen y Terapia Médica,
            short: i3M,
            url: https://i3m.csic.upv.es/,
          }
        location: Valencia, España
        period: Jul 2021 - Jul 2022
        summary: >-
          El objetivo principal es la investigación y desarrollo de metamateriales
          acústicos para su uso en aplicaciones arquitectónicas e imagen médica.
        bullets:
          - >-
            Desarrollo teórico de metadifusores acústicos basados en membranas o
            placas reduciendo el tamaño de los difusores comerciales.
          - Simulación de los difusores acústicos y validación de resultados (MATLAB y COMSOL).
          - >-
            Desarrollo y simulación de guías de ondas basadas en metamateriales para
            mejorar la resolución ultrasónica en aire.
          - Fabricación de prototipos de guías de ondas.
          - Resultados experimentales validados frente a los obtenidos en simulación.
          - >-
            Tutor del Trabajo Final de Máster de un estudiante del Máster en
            Ingeniería Acústica de la UPV.
        pubGroups:
          - heading: "Dos publicaciones en congresos nacionales e internacionales:"
            items:
              - >-
                Tecniacústica - [Beyond Schroeder diffusers using acoustic
                metasurfaces](/pdf/paper-resources/Conferences/Tecniacustica/JimenezTEC2020a.pdf).
              - >-
                Euronoise - [Sound diffusing metasurfaces based on elastic plates and
                membranes](/pdf/paper-resources/Conferences/Euronoise/plensEuro2021_2.pdf)
        ats:
          normal: true
          org: UPV · CSIC · i3M
          bullets:
            - >-
              Diseñé metamateriales acústicos (metadifusores y lentes) que reducen el
              tamaño de los difusores convencionales, validados con simulación en
              MATLAB y COMSOL.
            - >-
              Fabriqué y caractericé prototipos; publiqué resultados en congresos
              internacionales (Euronoise, Tecniacústica).
            - >-
              Tutoricé el Trabajo Fin de Máster de un estudiante del Máster en
              Ingeniería Acústica de la UPV, desde el diseño de la investigación
              hasta la defensa.

      - role: Investigador en proyecto europeo
        org:
          - {
              name: Escuela Politécnica Superior de Gandía,
              short: UPV,
              url: https://www.upv.es/entidades/epsg/home/,
            }
          - {
              name: Agencia Espacial Europea,
              short: ESA,
              url: https://www.esa.int/,
            }
        department:
          {
            name: Grupo de Acústica de Medios Complejos del IGIC,
            short: IGIC,
            url: https://igic.webs.upv.es/,
          }
        location: Gandía, España
        period: Feb 2020 - Jul 2021
        summary: >-
          Implementar y validar experimentalmente un método de mitigación del
          sonido, aplicable a una configuración real de vehículo de lanzamiento
          espacial (VEGA), que resulte en una disminución significativa de los
          niveles de presión sonora generados en el área de lanzamiento durante el
          despegue.
        notes:
          - >-
            Proyecto financiado por la ESA (Agencia Espacial Europea) con referencia
            ESA AO/1-9479/18/NL/LvH, en colaboración con: CNRS/Laboratoire
            d'Acoustique de la Université du Mans; COMET Ingeniería; Consejo Superior
            de Investigaciones Científicas (CSIC) y Universidad Politécnica de Madrid.
        bullets:
          - Diseño de la geometría óptima del metamaterial acústico para reducir los niveles de ruido.
          - Simulación de un entorno real para validar el rendimiento del diseño (MATLAB, COMSOL y Python).
          - Diseño del modelo industrial para la fabricación del prototipo mediante inyección de plástico.
          - >-
            Desarrollo de software para mediciones acústicas según las normas ISO
            10534-2 y ASTM E2611. [A|Lab](https://github.com/jmrplens/A-Lab)
          - >-
            Diseño y desarrollo de un sistema robótico de 3 ejes para realizar
            mediciones experimentales. Fotos e información aquí:
            [NEWS](https://cienciagandia.webs.upv.es/en/2022/03/metamaterial-to-reduce-noise-in-space-rocket-launches/ "Proyecto de metamateriales para lanzamientos de cohetes espaciales")
          - Resultados validados y aceptados por la ESA.
        pubGroups:
          - heading: "Tres publicaciones/presentaciones en congresos internacionales (Euronoise y ECSSMET) y una en congreso nacional (Tecniacústica):"
            items:
              - >-
                Euronoise - [Perfect broadband sound absorber metamaterial for noise
                reduction in a rocket launch](/pdf/paper-resources/Conferences/Euronoise/plensEuro2021.pdf).
              - >-
                Euronoise - [Application of metamaterials to control noise scattering
                during space vehicle lift-off](/pdf/paper-resources/Conferences/Euronoise/EscartiEuro2021.pdf).
              - "ECSSMET - Launch sound level characterisation and mitigation: numerical modelling framework and metamaterial proof of concept."
              - >-
                Tecniacústica - [Acoustic field prediction during the launch of
                rockets](/pdf/paper-resources/Conferences/Tecniacustica/plensTEC2020.pdf).
        ats:
          normal: true
          org: UPV · Agencia Espacial Europea (ESA) — IGIC
          bullets:
            - >-
              Diseñé y validé experimentalmente un metamaterial de mitigación de
              ruido para el lanzamiento del cohete VEGA (proyecto ESA
              AO/1-9479/18/NL/LvH), cumpliendo el 100% de los objetivos del proyecto
              y con resultados aceptados por la ESA.
            - >-
              Desarrollé software de medición acústica según ISO 10534-2 y ASTM 2611
              ([A|Lab](https://github.com/jmrplens/A-Lab)) y un sistema robótico de 3
              ejes para mediciones experimentales.
            - Coautor de publicaciones/ponencias internacionales (Euronoise, ECSSMET).

      - role: Prácticas de investigación
        org:
          - {
              name: Universidad de Alicante,
              short: UA,
              url: https://www.ua.es/es/index.html,
            }
        department:
          name: Dep. de Física, Ingeniería de Sistemas y Teoría de la Señal
          short: DFESTS
          url: https://dfests.ua.es/
        location: Alicante, España
        period: Feb 2018 - Jul 2018
        summary: >-
          Prácticas en diferentes proyectos de investigación en el [Grupo de
          Acústica Aplicada](https://iufacyt.ua.es/es/grupos-de-investigacion/acustica-aplicada.html "Grupo de Acústica Aplicada de la UA"),
          perteneciente al Instituto Universitario de Física Aplicada a las Ciencias
          y las Tecnologías de la Escuela Politécnica Superior de Alicante.
        bullets:
          - Simulación de modelos acústicos.
          - Mediciones acústicas mediante un sistema robótico controlado por LabView.
          - >-
            Investigación de la eficiencia de radiación acústica (ruido de origen
            vibratorio) de placas metálicas para un estudio inicial de las emisiones
            sonoras de buques en agua. Realizado en colaboración con
            [SAES](https://electronica-submarina.com/ "SAES - Electrónica Submarina"),
            aquí se puede leer una noticia al respecto:
            [NEWS](https://electronica-submarina.com/2018/11/05/saes-latest-researches-on-underwater-noise-by-ships-are-presented-at-tecniacustica/ "Investigación sobre ruido submarino de buques").
        pubGroups:
          - heading: "Una publicación en congreso nacional:"
            items:
              - >-
                Tecniacústica - [Comportamiento vibroacústico de contenedores
                cilíndricos en aire](/pdf/paper-resources/Conferences/Tecniacustica/saura2018.pdf).
        ats: { normal: false }

      - role: Fundador y Vocal
        org:
          - {
              name: AmicroTech,
              short: AµTech,
              url: "https://www.linkedin.com/company/a-µtech/",
            }
        department:
          {
            name: Universidad de Alicante,
            short: UA,
            url: https://www.ua.es/es/index.html,
          }
        location: Alicante, España
        period: Sep 2016 - Jul 2018
        summary: >-
          Asociación con sede en la Escuela Politécnica Superior de la Universidad de
          Alicante. Promueve el conocimiento de programación de
          microcontroladores orientada a proyectos.
        bullets:
          - >-
            Clases grupales de refuerzo y ampliación de la asignatura "Sistemas
            Electrónicos Digitales" del Grado en Ingeniería en Sonido e Imagen de la
            Universidad de Alicante.
          - Organización y planificación del laboratorio (situado en el Colegio Mayor).
          - Comunicación y Relaciones Públicas.
        ats: { normal: false }

      - role: Técnico de sonido
        org:
          - { name: Acusticox, url: https://acusticox.com/ }
        location: Cox, España
        period: Jun 2011 - Feb 2018
        bullets:
          - Instalación y ajuste de equipamiento para eventos.
          - Instalación y ajuste de equipamiento para instalación permanente.
          - Técnico de FOH.
          - Captación de clientes.
        ats: { normal: false }

      - role: Técnico de laboratorio
        org:
          - { name: Profdent, url: https://profdent.es/ }
        location: Alicante, España
        period: Sep 2005 - Nov 2009
        bullets:
          - Recepción de trabajos de dentistas.
          - Preparación y retoque de modelos.
          - Responsabilidades menores.
        ats: { normal: false }

