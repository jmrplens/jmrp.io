- title: Formación Académica
  type: time_table
  contents:
    - title: Doctorado en Tecnologías para la Salud y el Bienestar
      institution: Universitat Politècnica de València (<a href="https://www.upv.es/index-es.html" aria-label="UPV - Universitat Politècnica de València (Doctorado)">UPV</a>)
      department: Laboratorio de Ultrasonidos Médicos e Industriales (<a href="https://i3m.csic.upv.es/" aria-label="Laboratorio de Ultrasonidos Médicos e Industriales (UMIL) - Laboratorio (Doctorado)">UMIL</a>)
      location: Valencia, España
      year: 2023
      summary: >
        Aplicaciones industriales y biomédicas de metamateriales para el control de haces acústicos. En este proyecto, proponemos combinar nuevos transductores de ultrasonidos acoplados por aire con metamateriales hiperbólicos para diseñar sistemas de visión que superen las capacidades de imagen de los sistemas tradicionales.
        <br><br>
        Durante mi doctorado en Ingeniería Acústica aplicada a Biomedicina, realicé investigación avanzada:
      description:
        - Procesamiento de señales biomédicas y algoritmos de análisis acústico.
        - Caracterización ultrasónica para aplicaciones médicas.
        - Modelado computacional y simulación de fenómenos acústicos.
        - Desarrollo de metodologías experimentales para estudios biomédicos.
        - Publicación de resultados en conferencias y revistas especializadas.
        - "Tras completar prácticamente el programa doctoral, tomé la decisión estratégica de redirigir mi carrera hacia el desarrollo de software industrial. Esta transición me permitió aplicar mi sólida base en análisis de datos, programación y pensamiento analítico al sector del software, donde encontré una alineación más directa entre mis habilidades técnicas y mis objetivos profesionales a largo plazo."
      linkitems:
        - link: /pdf/degree/PhDExpEng.pdf
          linkname: "Expediente académico (ING)"
          ariaLabel: "Expediente académico (ING) - Programa de doctorado en inglés"
        - link: /pdf/degree/PhDExpCas.pdf
          linkname: "Expediente académico (ESP)"
          ariaLabel: "Expediente académico (ESP) - Programa de doctorado en español"
    - title: Máster en Ingeniería Acústica
      institution: Universitat Politècnica de València (<a href="https://www.upv.es/index-es.html" aria-label="UPV - Universitat Politècnica de València (Máster)">UPV</a>)
      department: Escuela Politécnica Superior de Gandía (<a href="https://www.upv.es/entidades/epsg/home/" aria-label="EPSG - Campus de Gandía (Máster)">EPSG</a>)
      location: Gandía, España
      year: 2019
      summary: >
        Título obtenido con Matrícula de Honor en: Fundamentos de Acústica, Aislamiento Acústico, Acústica Musical, Tratamiento de Señal en Ingeniería Acústica, Ultrasonidos y Técnicas de Simulación Acústica.
        <br><br>
        Trabajo Final de Máster titulado <strong>Difusores acústicos basados en resonadores de membrana y placa</strong>, calificado con Matrícula de Honor con mención especial.
      linkitems:
