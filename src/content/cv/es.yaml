basics:
  name: José Manuel Requena Plens
  headline: Ingeniero de Firmware y Software
  location: Valencia, España
  availability: Presencial, remota o híbrida
  email: jmrplens@gmail.com
  profile: >-
    **Ingeniero de firmware y software** con experiencia en firmware
    industrial para inversores solares (C, STM32, FreeRTOS) y una base sólida en
    **I+D**. Especializado en optimización de bajo nivel, comunicaciones
    industriales (Modbus) y automatización de pruebas sobre hardware. Mantengo
    proyectos *open source* usados por desarrolladores de todo el mundo. Oriento
    mi carrera a roles de **firmware, software y QA**, aportando rigor de
    ingeniería y foco en la calidad.
  links:
    - { kind: website, label: jmrp.io, url: https://jmrp.io }
    - {
        kind: github,
        label: github.com/jmrplens,
        url: https://github.com/jmrplens,
      }
    - {
        kind: linkedin,
        label: linkedin.com/in/jmrplens,
        url: https://www.linkedin.com/in/jmrplens,
      }
    - {
        kind: scholar,
        label: Google Scholar,
        url: "https://scholar.google.com/citations?user=9b0kPaUAAAAJ",
        ariaLabel: Google Scholar - perfil de publicaciones académicas,
      }
    - {
        kind: orcid,
        label: 0000-0003-1250-6212,
        url: https://orcid.org/0000-0003-1250-6212,
        ariaLabel: ORCID - identificador de investigador 0000-0003-1250-6212,
      }

