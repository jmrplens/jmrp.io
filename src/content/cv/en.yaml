- title: Experience
  type: time_table
  contents:
    - title: R&D Software Developer
      institution: Power Electronics (<a href="https://power-electronics.com/en" aria-label="PE - Power Electronics website">PE</a>)
      department: Solar + Storage (<a href="https://power-electronics.com/en/solar" aria-label="PE Solar - Power Electronics Solar & Storage division">PE Solar</a>)
      location: Lliria, Spain
      year: Apr 2023 - May 2026
      summary: >
        Firmware development for solar inverters and control systems in photovoltaic plants, working on STM32 microcontrollers with bare-metal and RTOS environments.
        <br><br>
        Key contributions:
      description:
        - "Optimized the embedded file system, reducing access times and improving stability under continuous operation."
        - "Improved TCP communications performance, reducing latency and increasing the robustness of the network stack."
        - "Optimized tasks on STM32: reduced stack and heap usage, and tuned CPU cycles to improve real-time performance."
        - "Implementation and maintenance of industrial communications: Modbus RTU/TCP, UART, I2C and SPI."
        - "Development in C with HAL layers and low-level peripheral management."
        - "Test automation on real hardware using Python, including unit, integration and stress tests."

    - title: Predoctoral researcher
      institution: Polytechnic University of Valencia (<a href="https://www.upv.es/index-en.html" aria-label="UPV - Polytechnic University of Valencia">UPV</a>) + Spanish National Research Council (<a href="https://www.csic.es/en" aria-label="CSIC - Spanish National Research Council">CSIC</a>) + Hospital La Fe (<a href="https://www.iislafe.es/en/" aria-label="IIS - Institute for Health Research La Fe">IIS</a>)
      department: Medical Imaging and Therapy Systems (<a href="https://i3m.csic.upv.es/" aria-label="i3M - Research Institute">i3M</a>)
      year: Jan 2023 - Apr 2023
      location: Valencia, Spain
      summary: >
        Researcher in the R&D line: <b>Acoustic Metamaterials for Ultrasound Histotripsy treatments</b>.
        <br><br>
        <b>Project</b>: New generation of smart metasurfaces based on additive manufacturing for strategic applications in telecommunications (Metasmart). Funded by the Valencian Agency for Innovation (Reference: INNEST/2022/345).
        <br><br>
        Some planned tasks:
      description:
        - Ultra-close focus acoustic lens design.
        - Prototype manufacturing.
        - Experimentation with ex-vivo tissues.

    - title: Predoctoral researcher
      institution: Polytechnic University of Valencia (<a href="https://www.upv.es/index-en.html" aria-label="UPV - Polytechnic University of Valencia">UPV</a>) + Spanish National Research Council (<a href="https://www.csic.es/en" aria-label="CSIC - Spanish National Research Council">CSIC</a>)
      department: Medical Imaging and Therapy Systems (<a href="https://i3m.csic.upv.es/" aria-label="i3M - Research Institute">i3M</a>)
      year: Jul 2021 - Jul 2022
      location: Valencia, Spain
      summary: >
        The main objective is to conduct research and development of acoustic metamaterials for use in architectural applications and medical imaging.
        <br><br>
        Goals achieved:
      description:
        - Theoretical development of acoustic metadiffusers based on membranes or plates reducing the size of commercial diffusers.
        - Simulation of the acoustic diffusers and validation of results (MATLAB & COMSOL).
        - title: "Two publications in national and international congresses:"
          contents:
            - Tecniacústica - <a href="/pdf/paper-resources/Conferences/Tecniacustica/JimenezTEC2020a.pdf">Beyond Schroeder diffusers using acoustic metasurfaces</a>.
            - Euronoise - <a href="/pdf/paper-resources/Conferences/Euronoise/plensEuro2021_2.pdf">Sound diffusing metasurfaces based on elastic plates and membranes</a>
        - Development and simulation of metamaterial-based waveguides for improved ultrasound resolution in air.
        - Fabrication of waveguide prototypes.
        - Validated experimental results against those obtained in simulation.
        - Advisor of the Master thesis of a student of the Master's Degree in Acoustic Engineering of the UPV.

    - title: Researcher in European project
      institution: Higher Polytechnic School of Gandia (<a href="https://www.upv.es/entidades/epsg/en/home/" aria-label="UPV - Gandia Campus">UPV</a>) + European Space Agency (<a href="https://www.esa.int/" aria-label="ESA - European Space Agency">ESA</a>)
      department: Complex Media Acoustics Group of IGIC (<a href="https://igic.webs.upv.es/" aria-label="IGIC - Interdisciplinary Institute for Coastal Management">IGIC</a>)
      year: Feb 2020 - Jul 2021
      location: Gandia, Spain
      summary:
        "Implement and experimentally validate a sound mitigation method, applicable to a real space vehicle launch configuration (VEGA), that results in a significant decrease in sound pressure levels generated in the launch area during spacecraft liftoff.
        <br><br>
        Project funded by ESA (European Space Agency) with reference ESA AO/1-9479/18/NL/LvH, in collaboration with: CNRS/Laboratoire d'Acoustique de la Université du Mans; COMET Ingeniería; Spanish National Research Council (CSIC) and Polytechnic University of Madrid.
        <br><br>
        All project objectives were completed at 100%:"
      description:
        - Design of the optimum geometry of the acoustic metamaterial to reduce noise levels.
        - Simulation of a real environment to validate design performance (MATLAB, COMSOL & Python).
        - Design of the industrial model for the manufacture of the prototype by means of plastic injection.
        - Development of software for acoustic measurements according to ISO 10534-2:1998 and ASTM 2611-19 standards. <a href="https://github.com/jmrplens/A-Lab">A|Lab</a>
        - 'Design and development of a 3-axis robotic system to perform experimental measurements. Photos and some information here: <a href="https://cienciagandia.webs.upv.es/en/2022/03/metamaterial-to-reduce-noise-in-space-rocket-launches/" aria-label="NEWS - Space rocket launches metamaterial project">NEWS</a>'
        - Results validated and accepted by ESA.
        - title: "Three publications/presentations at international congresses (Euronoise and ECSSMET) and one at a national congress (Tecniacústica):"
          contents:
            - Euronoise - <a href="/pdf/paper-resources/Conferences/Euronoise/plensEuro2021.pdf">Perfect broadband sound absorber metamaterial for noise reduction in a rocket launch</a>.
            - Euronoise - <a href="/pdf/paper-resources/Conferences/Euronoise/EscartiEuro2021.pdf">Application of metamaterials to control noise scattering during space vehicle lift-off</a>.
            - "ECSSMET - Launch sound level characterisation and mitigation: numerical modelling framework and metamaterial proof of concept."
            - Tecniacústica - <a href="/pdf/paper-resources/Conferences/Tecniacustica/plensTEC2020.pdf">Acoustic field prediction during the launch of rockets</a>.

    - title: Research internship
      institution: University of Alicante (<a href="https://www.ua.es/en/index.html" aria-label="UA - University of Alicante">UA</a>)
      department: Dep. of Physics, Systems Engineering and Signal Theory (<a href="https://dfests.ua.es/" aria-label="DFESTS - Department at UA">DFESTS</a>)
      year: Feb 2018 - Jul 2018
      location: Alicante, Spain
      summary:
        'Internship in different research projects in the <a href="https://iufacyt.ua.es/es/grupos-de-investigacion/acustica-aplicada.html" aria-label="Applied Acoustics Group at UA">Applied Acoustics Group</a>, belonging to the University Institute of Physics Applied to Sciences and Technologies of the Higher Polytechnic School of Alicante.
        <br><br>
        Goals achieved:'
      description:
        - Simulation of acoustic models.
        - Acoustic measurements by means of a LabView-controlled robotic system.
        - 'Investigation of the acoustic radiation efficiency (Vibration-borne noise) of metallic plates for an initial study of ship noise emissions in water. Carried out in collaboration with <a href="https://electronica-submarina.com/" aria-label="SAES - Marine Electronics">SAES</a>, here you can read a news item on the subject: <a href="https://electronica-submarina.com/2018/11/05/saes-latest-researches-on-underwater-noise-by-ships-are-presented-at-tecniacustica/" aria-label="NEWS - Ship underwater noise research">NEWS</a>.'
        - title: "A publication at a national congress:"
          contents:
            - Tecniacústica - <a href="/pdf/paper-resources/Conferences/Tecniacustica/saura2018.pdf">Comportamiento vibroacústico de contenedores cilíndricos en aire</a>.

    - title: Founder and Vocal Member
      institution: AmicroTech (<a href="https://www.linkedin.com/company/a-µtech/" aria-label="AµTech - AmicroTech LinkedIn profile">AµTech</a>)
      department: University of Alicante (<a href="https://www.ua.es/en/index.html" aria-label="UA - University of Alicante">UA</a>)
      year: Sep 2016 - Jul 2018
      location: Alicante, Spain
      summary:
        "Association based at the Higher Polytechnic School of the University of Alicante. Founded in 2016. Promotes project-oriented microcontroller programming knowledge.
        <br><br>
        Activities performed:"
      description:
        - Group classes of reinforcement and extension of the subject "Digital Electronic Systems" of the Degree in Sound and Image Engineering of the University of Alicante.
        - Laboratory organization and planning (located at the Colegio Mayor).
        - Communication and Public Relations.

    - title: Sound technician
