basics:
  name: José Manuel Requena Plens
  headline: Firmware & Software Engineer
  location: Valencia, Spain
  availability: On-site, remote or hybrid
  email: jmrplens@gmail.com
  profile: >-
    **Embedded firmware and software engineer** with experience building industrial
    firmware for solar inverters (C, STM32, FreeRTOS) and a solid R&D
    background in acoustics (physics). Focused on low-level optimization, industrial communications
    (Modbus) and hardware test automation. I maintain *open source* projects used
    by developers worldwide. Targeting **firmware, software and QA** roles,
    bringing engineering rigor and a focus on quality.
  links:
    - { kind: website, label: jmrp.io, url: https://jmrp.io }
    - {
        kind: github,
