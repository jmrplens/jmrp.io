- title: Formal education
  type: time_table
  contents:
    - title: PhD in Health and Wellness Technologies
      institution: Polytechnic University of Valencia (<a href="https://www.upv.es/index-en.html" aria-label="UPV - Polytechnic University of Valencia (PhD)">UPV</a>)
      department: Ultrasound Medical and Industrial Laboratory (<a href="https://i3m.csic.upv.es/" aria-label="Ultrasound Medical and Industrial Laboratory (UMIL) - Laboratory (PhD)">UMIL</a>)
      location: Valencia, Spain
      year: 2023
      summary: >
        Industrial and biomedical applications of metamaterials for the control of acoustic beams. In this project, we propose to combine new air-coupled ultrasound transducers with hyperbolic metamaterials to design vision systems that exceed the imaging capabilities of traditional systems.
        <br><br>
        During my PhD in Acoustic Engineering applied to Biomedicine, I conducted advanced research:
      description:
        - Biomedical signal processing and acoustic analysis algorithms.
        - Ultrasound characterization for medical applications.
        - Computational modeling and simulation of acoustic phenomena.
        - Development of experimental methodologies for biomedical studies.
        - Publication of results in specialized conferences and journals.
        - "After nearly completing the doctoral program, I made the strategic decision to redirect my career toward industrial software development. This transition allowed me to apply my solid foundation in data analysis, programming, and analytical thinking to the software sector, where I found a more direct alignment between my technical skills and my long-term professional goals."
      linkitems:
        - link: /pdf/degree/PhDExpEng.pdf
          linkname: "Academic record (ENG)"
          ariaLabel: "Academic record (ENG) - PhD program in English"
        - link: /pdf/degree/PhDExpCas.pdf
          linkname: "Academic record (SPA)"
          ariaLabel: "Academic record (SPA) - PhD program in Spanish"
    - title: Master's Degree in Acoustical Engineering
      institution: Polytechnic University of Valencia (<a href="https://www.upv.es/index-en.html" aria-label="UPV - Polytechnic University of Valencia (Master)">UPV</a>)
      department: Higher Polytechnic School of Gandia (<a href="https://www.upv.es/entidades/epsg/en/home/" aria-label="EPSG - Gandia Campus (Master)">EPSG</a>)
      location: Gandia, Spain
      year: 2019
      summary: >
        Degree obtained with honors in: Fundamentals of Acoustics, Acoustic Isolation, Musical Acoustics, Signal Processing in Acoustic Engineering, Ultrasonics and Acoustic Simulation Techniques.
        <br><br>
        Final Master's thesis entitled <strong>Difusores acústicos basados en resonadores de membrana y placa</strong> ('Acoustic diffusers based on membrane and plate resonators'), qualified with honors with special mention.
      linkitems:
