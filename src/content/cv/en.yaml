sections:
  - kind: experience
    title: Experience
    items:
      - role: R&D Software Developer
        org:
          - {
              name: Power Electronics S.L.,
              short: PE,
              url: https://power-electronics.com/en,
            }
        department:
          {
            name: Solar + Storage,
            short: PE Solar,
            url: https://power-electronics.com/en/solar,
          }
        location: Lliria, Spain
        period: Apr 2023 - May 2026
        summary: >-
          Firmware development for solar inverters and control systems in
          photovoltaic plants, working on STM32 microcontrollers with bare-metal
          and RTOS environments.
        bullets:
          - >-
            Reduced RTOS task stack usage by 30%–50%, optimizing memory on STM32
            microcontrollers.
          - >-
            Optimized Modbus TCP request handling, cutting CPU usage under load
            (40,000 req/s) from 80% to 17% with no dropped responses.
          - >-
            Redesigned embedded file-system access, cutting access times by over
            50%.
          - >-
            Implemented a scheduled purge (daily/monthly) that safely clears
            thousands of files, preventing storage exhaustion under continuous
            operation.
          - >-
            Built and maintained industrial communications in C with hardware
            abstraction layers (HAL): Modbus RTU/TCP, UART, I2C and SPI.
          - >-
            Automated the test suite: ~50–80 unit tests per module (Ceedling,
            thousands in total) reaching 100% line and branch coverage via
            standard-library mocks/fakes, plus hundreds of on-hardware integration
            tests (pytest) — TCP/FTP performance and FTP security —; all in CI.
          - >-
            Reviewed merge requests across a 12-person team, catching bugs and
            proposing improvements before integration.
        ats:
          normal: true
          org: Power Electronics S.L. — Solar + Storage

      - role: Predoctoral researcher
        org:
          - {
              name: Polytechnic University of Valencia,
              short: UPV,
              url: https://www.upv.es/index-en.html,
            }
          - {
              name: Spanish National Research Council,
              short: CSIC,
              url: https://www.csic.es/en,
            }
          - {
              name: Hospital La Fe,
              short: IIS,
              url: https://www.iislafe.es/en/,
            }
        department:
          {
            name: Medical Imaging and Therapy Systems,
            short: i3M,
            url: https://i3m.csic.upv.es/,
          }
        location: Valencia, Spain
        period: Jan 2023 - Apr 2023
        summary: >-
          Researcher in the R&D line: **Acoustic Metamaterials for Ultrasound
          Histotripsy treatments**.
        notes:
          - >-
            **Project**: New generation of smart metasurfaces based on additive
            manufacturing for strategic applications in telecommunications
            (Metasmart). Funded by the Valencian Agency for Innovation (Reference:
            INNEST/2022/345).
        bullets:
          - Ultra-close focus acoustic lens design.
          - Prototype manufacturing.
          - Experimentation with ex-vivo tissues.
        ats: { normal: false }

      - role: Predoctoral researcher
        org:
          - {
              name: Polytechnic University of Valencia,
              short: UPV,
              url: https://www.upv.es/index-en.html,
            }
          - {
              name: Spanish National Research Council,
              short: CSIC,
              url: https://www.csic.es/en,
            }
        department:
          {
            name: Medical Imaging and Therapy Systems,
            short: i3M,
            url: https://i3m.csic.upv.es/,
          }
        location: Valencia, Spain
        period: Jul 2021 - Jul 2022
        summary: >-
          The main objective is to conduct research and development of acoustic
          metamaterials for use in architectural applications and medical imaging.
        bullets:
          - >-
            Developed acoustic metadiffusers reaching a diffusion coefficient of 0.8
            with a thickness 10× smaller than traditional diffusers.
          - Simulation of the acoustic diffusers and validation of results (MATLAB & COMSOL).
          - >-
            Designed and 3D-printed (resin) slitted-tube waveguides with
            numerically-computed slits (2–3 cm tubes, ~0.5 mm slits) that increased
            ultrasound directivity and range ~15× in air, validated experimentally.
          - Validated experimental results against those obtained in simulation.
          - >-
            Advisor of the Master thesis of a student of the Master's Degree in
            Acoustic Engineering of the UPV.
        pubGroups:
          - heading: "Two publications in national and international congresses:"
            items:
              - >-
                Tecniacústica - [Beyond Schroeder diffusers using acoustic
                metasurfaces](/pdf/paper-resources/Conferences/Tecniacustica/JimenezTEC2020a.pdf).
              - >-
                Euronoise - [Sound diffusing metasurfaces based on elastic plates and
                membranes](/pdf/paper-resources/Conferences/Euronoise/plensEuro2021_2.pdf)
        ats:
          normal: true
          org: UPV · CSIC · i3M
          bullets:
            - >-
              Designed acoustic metamaterials (metadiffusers and lenses) that reduce
              the footprint of conventional diffusers, validated with MATLAB and
              COMSOL simulations.
            - >-
              Manufactured and characterized prototypes; published results at
              international conferences (Euronoise, Tecniacústica).
            - >-
              Supervised a Master's thesis in Acoustic Engineering (UPV), from
              research design to defense.

      - role: Researcher in European project
        org:
          - {
              name: Higher Polytechnic School of Gandia,
              short: UPV,
              url: https://www.upv.es/entidades/epsg/en/home/,
            }
          - {
              name: European Space Agency,
              short: ESA,
              url: https://www.esa.int/,
            }
        department:
          {
            name: Complex Media Acoustics Group of IGIC,
            short: IGIC,
            url: https://igic.webs.upv.es/,
          }
        location: Gandia, Spain
        period: Feb 2020 - Jul 2021
        summary: >-
          Implement and experimentally validate a sound mitigation method,
          applicable to a real space vehicle launch configuration (VEGA), that
          results in a significant decrease in sound pressure levels generated in the
          launch area during spacecraft liftoff.
        notes:
          - >-
            Project funded by ESA (European Space Agency) with reference ESA
            AO/1-9479/18/NL/LvH, in collaboration with: CNRS/Laboratoire d'Acoustique
            de la Université du Mans; COMET Ingeniería; Spanish National Research
            Council (CSIC) and Polytechnic University of Madrid.
        bullets:
          - >-
            Designed the optimum acoustic-metamaterial geometry, achieving near-total
            absorption (α ≈ 1) across 200–500 Hz with a subwavelength design
            (wavelength/thickness ratio ≈ 16.5 vs ~2 conventional), validated on real
            lab prototypes.
          - Simulation of a real environment to validate design performance (MATLAB, COMSOL & Python).
          - >-
            Designed and 3D-printed the first prototype; for the large-scale version
            designed the injection-molding model and sourced the manufacturing of 600
            modules with a supplier.
          - >-
            Development of software for acoustic measurements according to ISO
            10534-2 and ASTM E2611 standards. [A|Lab](https://github.com/jmrplens/A-Lab)
          - >-
            Design and development of a 3-axis robotic system to perform experimental
            measurements. Photos and some information here:
            [NEWS](https://cienciagandia.webs.upv.es/en/2022/03/metamaterial-to-reduce-noise-in-space-rocket-launches/ "Space rocket launches metamaterial project")
          - Results validated and accepted by ESA.
        pubGroups:
          - heading: "Three publications/presentations at international congresses (Euronoise and ECSSMET) and one at a national congress (Tecniacústica):"
            items:
              - >-
                Euronoise - [Perfect broadband sound absorber metamaterial for noise
                reduction in a rocket launch](/pdf/paper-resources/Conferences/Euronoise/plensEuro2021.pdf).
              - >-
                Euronoise - [Application of metamaterials to control noise scattering
                during space vehicle lift-off](/pdf/paper-resources/Conferences/Euronoise/EscartiEuro2021.pdf).
              - "ECSSMET - Launch sound level characterisation and mitigation: numerical modelling framework and metamaterial proof of concept."
              - >-
                Tecniacústica - [Acoustic field prediction during the launch of
                rockets](/pdf/paper-resources/Conferences/Tecniacustica/plensTEC2020.pdf).
        ats:
          normal: true
          org: UPV · European Space Agency (ESA) — IGIC
          bullets:
            - >-
              Designed and experimentally validated a noise-mitigation metamaterial
              for the VEGA rocket launch (ESA project AO/1-9479/18/NL/LvH), meeting
              100% of project objectives with results accepted by ESA.
            - >-
              Developed acoustic measurement software per ISO 10534-2 and ASTM 2611
              ([A|Lab](https://github.com/jmrplens/A-Lab)) and a 3-axis robotic system
              for experimental measurements.
            - Co-author of international publications/talks (Euronoise, ECSSMET).

      - role: Research internship
        org:
          - {
              name: University of Alicante,
              short: UA,
              url: https://www.ua.es/en/index.html,
            }
        department:
          name: Dep. of Physics, Systems Engineering and Signal Theory
          short: DFESTS
          url: https://dfests.ua.es/
        location: Alicante, Spain
        period: Feb 2018 - Jul 2018
        summary: >-
          Internship in different research projects in the [Applied Acoustics
          Group](https://iufacyt.ua.es/es/grupos-de-investigacion/acustica-aplicada.html "Applied Acoustics Group at UA"),
          belonging to the University Institute of Physics Applied to Sciences and
          Technologies of the Higher Polytechnic School of Alicante.
        bullets:
          - Simulation of acoustic models.
          - Acoustic measurements by means of a LabView-controlled robotic system.
          - >-
            Investigation of the acoustic radiation efficiency (Vibration-borne
            noise) of metallic plates for an initial study of ship noise emissions in
            water. Carried out in collaboration with
            [SAES](https://electronica-submarina.com/ "SAES - Marine Electronics"),
            here you can read a news item on the subject:
            [NEWS](https://electronica-submarina.com/2018/11/05/saes-latest-researches-on-underwater-noise-by-ships-are-presented-at-tecniacustica/ "Ship underwater noise research").
        pubGroups:
          - heading: "A publication at a national congress:"
            items:
              - >-
                Tecniacústica - [Comportamiento vibroacústico de contenedores
                cilíndricos en aire](/pdf/paper-resources/Conferences/Tecniacustica/saura2018.pdf).
        ats: { normal: false }

      - role: Founder and Vocal Member
        org:
          - {
              name: AmicroTech,
              short: AµTech,
              url: "https://www.linkedin.com/company/a-µtech/",
            }
        department:
          {
            name: University of Alicante,
            short: UA,
            url: https://www.ua.es/en/index.html,
          }
        location: Alicante, Spain
        period: Sep 2016 - Jul 2018
        summary: >-
          Association based at the Higher Polytechnic School of the University of
          Alicante. Promotes project-oriented microcontroller
          programming knowledge.
        bullets:
          - >-
            Taught 30+ students in reinforcement and extension classes for the
            subject "Digital Electronic Systems" of the Degree in Sound and Image
            Engineering of the University of Alicante.
          - Laboratory organization and planning (located at the Colegio Mayor).
          - Communication and Public Relations.
        ats: { normal: false }

      - role: Sound technician
        org:
          - { name: Acusticox, url: https://acusticox.com/ }
        location: Cox, Spain
        period: Jun 2011 - Feb 2018
        bullets:
          - Equipment installation and adjustment for events.
          - Equipment installation and adjustment for permanent installation.
          - FOH Technician.
          - Customer acquisition.
        ats: { normal: false }

      - role: Laboratory technician
        org:
          - { name: Profdent, url: https://profdent.es/ }
        location: Alicante, Spain
        period: Sep 2005 - Nov 2009
        bullets:
          - >-
            Reception of work and casting of plaster models from impressions
            (alginate/silicone), with and without implants.
          - Mounting articulators and casting metal crowns in a centrifuge.
          - Ceramic application on crowns and bridges.
        ats: { normal: false }

