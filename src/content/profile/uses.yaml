type: uses

# Real inventory. Per the "only mine" link policy, `href` is set ONLY on the
# author's own services/infrastructure (homelab), never on third-party
# products (MacBook, LG, VS Code, …). Paths starting with "/" are localized at
# render; full URLs are used verbatim. Homelab specs sourced from the fleet's
# own server-info docs (TrueNAS i5-14400/64 GB, social node Ryzen 3550H, edge
# Ryzen 5500U, HA i3-7100U, 2× IONOS Tor VPS UK+ES). TrueNAS's GPU
# (GeForce RTX 4060, 8 GB, as its driver reports it) and the social node's
# services (Mastodon and the AT Protocol PDS, `pds-eu`) were read over SSH on
# 2026-11-12.

