type: uses

# Real inventory. Per the "only mine" link policy, `href` is set ONLY on the
# author's own services/infrastructure (homelab) — never on third-party
# products (MacBook, LG, VS Code, …). Paths starting with "/" are localized at
# render; full URLs are used verbatim. Homelab specs sourced from the fleet's
# own server-info docs (TrueNAS i5-14400/64 GB, Mastodon Ryzen 3550H, edge
# Ryzen 5500U, HA i3-7100U, 2× IONOS Tor VPS UK+ES).

