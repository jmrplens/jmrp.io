type: about

# Featured open-source projects: names pulled from the CV's "Open Source
# Projects" section at build time (single source — edit the project data in
# src/content/cv/{en,es}.yaml, curate the selection here).
featuredProjects:
  - gitlab-mcp-server
  - phonometry
  - cs-routeros-bouncer
  - TFG-TFM_EPS

# Person facts → ProfilePage / Person JSON-LD (sameAs comes from site config).
person:
  jobTitle:
    en: R&D · Firmware & Software Engineer
    es: I+D · Ingeniero de Firmware y Software
  description:
    en: Firmware and software engineer in Valencia, Spain — industrial embedded systems, open-source tooling, and self-hosted infrastructure.
    es: Ingeniero de firmware y software en Valencia — sistemas embebidos industriales, herramientas open source e infraestructura self-hosted.

  # Machine-readable contact for the canonical entity. Already public in
  # plaintext in public/.well-known/security.txt, so this exposes nothing new —
  # it only makes the address reachable by a consumer parsing the graph instead
  # of scraping the page. The VISIBLE address stays obfuscated by
  # ObfuscatedEmail.astro (CSS pseudo-elements); that is a separate layer and
  # must not be "simplified" to match this one.
  email: mail@jmrp.io

  # Funding page → `potentialAction` as a DonateAction. Not a `sameAs`: the
  # GitHub account is already asserted there, and this is a place to act, not
  # an identity to resolve.
  sponsorUrl: https://github.com/sponsors/jmrplens

  # The profession, deliberately NOT `worksFor`. schema.org's `worksFor` reads
  # as present tense, and the last employment ended — asserting it here would
  # publish a stale employer to this site AND to the six project documentation
  # sites that splice this entity in verbatim. `hasOccupation` states what he
  # does without claiming who currently pays for it.
  occupation:
    en: Firmware & Software Engineer
    es: Ingeniero de Firmware y Software

  # Languages, as BCP-47 tags. schema.org defines no standard proficiency
  # property on Language, so "native" is deliberately not encoded rather than
  # invented — Spanish is listed first, which is the only ordering signal the
  # vocabulary actually supports.
  knowsLanguage:
    - { name: Spanish, code: es }
    - { name: English, code: en }

  # City-level only, on purpose: enough to disambiguate the entity
  # geographically without publishing a home address.
  homeLocation:
    locality: Valencia
    region: Valencian Community
    country: ES
  knowsAbout:
    - Embedded firmware
    - STM32
    - FreeRTOS
    - Modbus
    - Firmware testing
    - Go
    - Model Context Protocol
    - Network security
    - Acoustics
    - Digital signal processing

en:
  kicker: Profile
  title: The engineer behind the notebook.
  lead:
    - I'm José Manuel — a firmware and software engineer based in Valencia, Spain, with an R&D background. I write firmware in C for industrial hardware and developer tooling in Go, and I maintain 38 public repositories on GitHub that have collected more than 350 stars between them (August 2026).
    - "I came to engineering from acoustics and instrumentation — a degree in Telecommunication Engineering and a Master's in Acoustical Engineering, followed by four years of predoctoral research at the UPV (2019–2023) on ultrasound and acoustic metamaterials, before redirecting toward software. That period left 14 academic publications behind it: one journal article, eleven conference papers and two theses. I still gravitate to problems that sit where signal, system and software meet."
    - "Between 2023 and 2026 I built industrial embedded firmware in C on STM32 and FreeRTOS for solar inverters and battery storage — low-level optimization, industrial communications (Modbus) and hardware test automation. The open-source half of the work is the measurable one: my two MCP servers have been pulled more than 7,500 times from Docker Hub, gitlab-mcp-server has published more than 50 versions to the official Model Context Protocol registry, and more than 15 of my papers, theses and software releases are archived with a DOI on Zenodo."
  note: "This site is my notebook: what I learn I write down, what I build I publish."
  labels:
    build: I build
    writesAbout: I write about
    projects: Featured open source
    education: Education
    contact: Say hi
  build:
    - I write embedded firmware in C for STM32 and FreeRTOS.
    - I automate hardware testing and industrial Modbus communications.
    - I publish MCP servers and developer tooling written in Go.
    - I self-host the infrastructure that serves this site and its 17 browser-only tools.
  writesAbout:
    - Firmware & low level
    - Networking (MikroTik, nginx)
    - Homelab & security (CSP)
    - Acoustics & DSP
  education:
    - degree: Predoctoral research — Health & Wellness Technologies
      org: UPV · i3M / UMIL
      year: 2019–2023
      note: Acoustic metamaterials & ultrasound imaging; redirected to industry.
    - degree: Master's in Acoustical Engineering
      org: UPV · EPSG Gandia
      year: "2019"
      note: Graduated with honors; thesis with special distinction.
    - degree: Degree in Telecommunication Engineering (Sound & Image)
      org: University of Alicante
      year: "2018"
      note: Acoustic Engineering + Audiovisual Technology.

es:
  kicker: Perfil
  title: El ingeniero detrás del cuaderno.
  lead:
    - Soy José Manuel, ingeniero de firmware y software en Valencia, con base en I+D. Escribo firmware en C para hardware industrial y herramientas de desarrollo en Go, y mantengo 38 repositorios públicos en GitHub que suman más de 350 estrellas (agosto de 2026).
    - "Llegué a la ingeniería desde la acústica y la instrumentación —un grado en Ingeniería de Telecomunicación y un Máster en Ingeniería Acústica, y después cuatro años de investigación predoctoral en la UPV (2019–2023) sobre ultrasonidos y metamateriales acústicos— antes de reorientarme al software. De esa etapa quedan 14 publicaciones académicas: un artículo de revista, once comunicaciones en congresos y dos tesis. Sigo prefiriendo los problemas donde la señal, el sistema y el software se tocan."
    - "Entre 2023 y 2026 desarrollé firmware embebido industrial en C sobre STM32 y FreeRTOS para inversores solares y almacenamiento en baterías —optimización de bajo nivel, comunicaciones industriales (Modbus) y automatización de pruebas sobre hardware—. La parte open source es la medible: mis dos servidores MCP acumulan más de 7.500 descargas en Docker Hub, gitlab-mcp-server ha publicado más de 50 versiones en el registro oficial del Model Context Protocol, y más de 15 de mis artículos, tesis y publicaciones de software están archivados con DOI en Zenodo."
  note: "Este sitio es mi cuaderno: lo que aprendo lo escribo, lo que construyo lo publico."
