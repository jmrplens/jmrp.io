en:
  kicker: Profile
  title: The engineer behind the notebook.
  lead:
    - I'm José Manuel — a firmware and software engineer based in Valencia, Spain, working in R&D. Day to day that means industrial embedded firmware in C on STM32 and FreeRTOS for solar inverters and storage, with a focus on low-level optimization, industrial communications (Modbus) and hardware test automation.
    - I came to engineering from acoustics and instrumentation — a degree in Telecommunication Engineering and a Master's in Acoustical Engineering, followed by predoctoral research at the UPV on ultrasound and acoustic metamaterials, before redirecting toward industrial software. I still gravitate to problems that sit where signal, system and software meet.
    - I maintain open-source projects used by developers worldwide — a GitLab MCP server, signal-processing and network-security tooling — and I care about doing the work with engineering rigor and a focus on quality.
  note: "This site is my notebook: what I learn I write down, what I build I publish."
  labels:
    build: I build
    writesAbout: I write about
    projects: Featured open source
    education: Education
    contact: Say hi
