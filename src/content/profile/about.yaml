type: about

# Featured open-source projects: names pulled from the CV's "Open Source
# Projects" section at build time (single source — edit the project data in
# src/content/cv/{en,es}.yaml, curate the selection here).
featuredProjects:
  - gitlab-mcp-server
  - phonometry
  - cs-routeros-bouncer
  - TFG-TFM_EPS

# Person facts → ProfilePage / Person JSON-LD (sameAs comes from site config).
person:
  jobTitle:
    en: R&D · Firmware & Software Engineer
    es: I+D · Ingeniero de Firmware y Software
  description:
    en: Firmware and software engineer in Valencia, Spain — industrial embedded systems, open-source tooling, and self-hosted infrastructure.
    es: Ingeniero de firmware y software en Valencia — sistemas embebidos industriales, herramientas open source e infraestructura self-hosted.

  # Machine-readable contact for the canonical entity. Already public in
  # plaintext in public/.well-known/security.txt, so this exposes nothing new —
  # it only makes the address reachable by a consumer parsing the graph instead
  # of scraping the page. The VISIBLE address stays obfuscated by
  # ObfuscatedEmail.astro (CSS pseudo-elements); that is a separate layer and
  # must not be "simplified" to match this one.
  email: mail@jmrp.io

  # The profession, deliberately NOT `worksFor`. schema.org's `worksFor` reads
  # as present tense, and the last employment ended — asserting it here would
  # publish a stale employer to this site AND to the six project documentation
  # sites that splice this entity in verbatim. `hasOccupation` states what he
  # does without claiming who currently pays for it.
  occupation:
    en: Firmware & Software Engineer
    es: Ingeniero de Firmware y Software

  # Languages, as BCP-47 tags. schema.org defines no standard proficiency
  # property on Language, so "native" is deliberately not encoded rather than
  # invented — Spanish is listed first, which is the only ordering signal the
  # vocabulary actually supports.
  knowsLanguage:
    - { name: Spanish, code: es }
    - { name: English, code: en }

  # City-level only, on purpose: enough to disambiguate the entity
  # geographically without publishing a home address.
  homeLocation:
    locality: Valencia
    region: Valencian Community
    country: ES
  knowsAbout:
    - Embedded firmware
    - STM32
    - FreeRTOS
    - Modbus
    - Firmware testing
    - Go
    - Model Context Protocol
    - Network security
    - Acoustics
    - Digital signal processing

en:
  kicker: Profile
  title: The engineer behind the notebook.
  lead:
    - I'm José Manuel — a firmware and software engineer based in Valencia, Spain, with an R&D background. Day to day I'm programming across a range of languages, building and maintaining open-source projects, and keeping up with what's new in software and the open-source world.
    - I came to engineering from acoustics and instrumentation — a degree in Telecommunication Engineering and a Master's in Acoustical Engineering, followed by predoctoral research at the UPV on ultrasound and acoustic metamaterials, before redirecting toward software. I still gravitate to problems that sit where signal, system and software meet.
    - Most recently I built industrial embedded firmware in C on STM32 and FreeRTOS for solar inverters and storage — low-level optimization, industrial communications (Modbus) and hardware test automation. The open-source projects I maintain are used by developers worldwide, and I care about doing the work with engineering rigor and a focus on quality.
  note: "This site is my notebook: what I learn I write down, what I build I publish."
  labels:
    build: I build
    writesAbout: I write about
    projects: Featured open source
    education: Education
    contact: Say hi
  build:
    - Embedded firmware (C, STM32, FreeRTOS)
    - Industrial comms & test automation (Modbus)
    - MCP servers & tooling in Go
    - Self-hosted infrastructure & security
  writesAbout:
    - Firmware & low level
    - Networking (MikroTik, nginx)
    - Homelab & security (CSP)
    - Acoustics & DSP
  education:
    - degree: Predoctoral research — Health & Wellness Technologies
      org: UPV · i3M / UMIL
      year: 2019–2023
      note: Acoustic metamaterials & ultrasound imaging; redirected to industry.
    - degree: Master's in Acoustical Engineering
      org: UPV · EPSG Gandia
      year: "2019"
      note: Graduated with honors; thesis with special distinction.
    - degree: Degree in Telecommunication Engineering (Sound & Image)
      org: University of Alicante
      year: "2018"
      note: Acoustic Engineering + Audiovisual Technology.

es:
  kicker: Perfil
  title: El ingeniero detrás del cuaderno.
  lead:
    - Soy José Manuel, ingeniero de firmware y software en Valencia, con base en I+D. En el día a día programo en varios lenguajes, construyo y mantengo proyectos open source, y me mantengo al día de las novedades del software y del mundo del código abierto.
    - Llegué a la ingeniería desde la acústica y la instrumentación —un grado en Ingeniería de Telecomunicación y un Máster en Ingeniería Acústica, y después investigación predoctoral en la UPV sobre ultrasonidos y metamateriales acústicos— antes de reorientarme al software. Sigo prefiriendo los problemas donde la señal, el sistema y el software se tocan.
    - Lo más reciente ha sido firmware embebido industrial en C sobre STM32 y FreeRTOS para inversores solares y almacenamiento —optimización de bajo nivel, comunicaciones industriales (Modbus) y automatización de pruebas sobre hardware—. Los proyectos open source que mantengo los usan desarrolladores de todo el mundo, y me importa hacer el trabajo con rigor de ingeniería y foco en la calidad.
  note: "Este sitio es mi cuaderno: lo que aprendo lo escribo, lo que construyo lo publico."
  labels:
