es:
  kicker: Perfil
  title: El ingeniero detrás del cuaderno.
  lead:
    - Soy José Manuel, ingeniero de firmware y software en Valencia, trabajando en I+D. En el día a día eso es firmware embebido industrial en C sobre STM32 y FreeRTOS para inversores solares y almacenamiento, con foco en optimización de bajo nivel, comunicaciones industriales (Modbus) y automatización de pruebas sobre hardware.
    - Llegué a la ingeniería desde la acústica y la instrumentación —un grado en Ingeniería de Telecomunicación y un Máster en Ingeniería Acústica, y después investigación predoctoral en la UPV sobre ultrasonidos y metamateriales acústicos— antes de reorientarme al software industrial. Sigo prefiriendo los problemas donde la señal, el sistema y el software se tocan.
    - Mantengo proyectos open source usados por desarrolladores de todo el mundo —un servidor MCP para GitLab, herramientas de procesado de señal y de seguridad de red— con rigor de ingeniería y foco en la calidad.
  note: "Este sitio es mi cuaderno: lo que aprendo lo escribo, lo que construyo lo publico."
