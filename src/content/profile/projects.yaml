type: projects

# Open-source projects surfaced on /projects/ (and /es/projects/).
#
# This file is the SINGLE SOURCE for both the rendered page and the
# SoftwareApplication / SoftwareSourceCode JSON-LD nodes that link the
# canonical `https://jmrp.io/#person` entity to the software it authors.
#
# ── Rules for editing ────────────────────────────────────────────────────
# * `id` is the GitHub repo name. `softwareId` is derived as
#   `https://github.com/jmrplens/<id>#software` — the SAME @id the project's
#   own documentation site publishes, so both documents describe ONE node.
# * `name` and `summary.en` MUST match, verbatim, the `name`/`description`
#   the project's own site publishes for that @id. Divergent values on a
#   shared @id contradict each other and weaken the entity instead of
#   reinforcing it. Re-verified against the live @id nodes on 2026-09-03 for
#   all five projects that have a docs site. Matching: phonometry,
#   cs-routeros-bouncer, Cloudflare-DNS-Updater. Two still read differently,
#   for different reasons. gitlab-mcp-server ("850+ actions — 1,000+ depending
#   on edition and deployment" here vs "1000+ tools" there) is NOT
#   drift: the author confirmed on 2026-09-03 that the two counts measure
#   different GitLab tiers, so both are true and this entry is a deliberate,
#   accepted exception to the verbatim rule. libgen-mcp (this copy says
#   "search and download ... from Library Genesis", the docs site says
#   "federated search, citation and reading ... across the Library Genesis
#   catalog and open-access sources") is undecided: no third source says
#   which side is stale, and the difference is a feature claim, not a figure.
#   Nothing enforces this rule: it drifted unnoticed from 2026-07-28 to
#   2026-09-03, when phonometry's figures had moved 550/58/367 → 613/60/378.
#   Projects without a docs site use the repo/CV copy.
# * `summary.es` is display-only. JSON-LD always emits `summary.en`, on both
#   locales, because the software entity is language-neutral and its
#   canonical description must not fork per page.
# * `hosted`/`hostedEs` point at the PAGE documenting a public running
#   instance, not at the endpoint itself — the MCP endpoints answer 405 to a
#   browser's GET. Card link only, never JSON-LD: the running instance is a
#   different entity from the program, and mcp.jmrp.io already publishes that
#   node and links it to this project's `#software` @id via `targetProduct`.
# * `listings` are the project's third-party listings worth navigating to
#   (npm, PyPI, the CrowdSec Hub, an MCP directory) — at most three, rendered
#   on the card in the authored order. `buildProjectSchema` folds their URLs
#   into `sameAs` on its own, so never repeat one under `sameAs`. `icon` is a
#   bare Iconify id — the UnoCSS YAML extractor picks it up without the `i-`
#   prefix.
# * `sameAs` holds the registry/identity URLs that are NOT rendered: secondary
#   directories and the Zenodo DOI. Identity signal only, no navigation.
# * `endpoint` is the raw callable MCP URL and the single source of truth for
#   the fleet: BaseHead/build-identity derive `<endpoint>#api` owns @ids from
#   it, the /homelab/ MCP card lists it, and llms.txt iterates it. Adding a
#   server = adding this field (mcp.jmrp.io/servers.json must list it too).
# * `topics[].wikidata` Q-ids are verified against the Wikidata
#   `wbgetentities` API (label + description read, not just search hit).
#   First topic → `about`, the rest → `mentions`.

projects:
  # ── Active ─────────────────────────────────────────────────────────────
  - id: gitlab-mcp-server
    name: GitLab MCP Server
    status: active
    schemaType: SoftwareApplication
    applicationCategory: DeveloperApplication
    applicationSubCategory: Version Control
    language: Go
    license: MIT
    repo: https://github.com/jmrplens/gitlab-mcp-server
    docs: https://jmrplens.github.io/gitlab-mcp-server/
    docsEs: https://jmrplens.github.io/gitlab-mcp-server/es/
    hosted: https://mcp.jmrp.io/servers/gitlab/
    hostedEs: https://mcp.jmrp.io/es/servers/gitlab/
    endpoint: https://mcp.jmrp.io/gitlab
    registryId: io.github.jmrplens/gitlab-mcp-server
    listings:
      # npm first: a reader looking at the card usually wants to install it.
      # Glama keeps its link — it is a discovery directory, a different
      # question — and its ranking depends on the link existing, not on where
      # in the row it sits.
      - label: npm
        url: https://www.npmjs.com/package/@jmrp.io/gitlab-mcp-server
        icon: simple-icons:npm
      # PyPI ships the same native Go binary for Python toolchains (`pip`/
      # `uvx`); a second install answer, so it sits with npm, before Glama.
      - label: PyPI
        url: https://pypi.org/project/jmrplens-gitlab-mcp-server/
        icon: simple-icons:pypi
      - label: Glama
        url: https://glama.ai/mcp/servers/jmrplens/gitlab-mcp-server
        icon: mdi:view-grid-outline
    sameAs:
      - https://cursor.directory/plugins/gitlab-mcp-server
      - https://mcp.so/server/gitlab-mcp-server/jmrplens
      - https://lobehub.com/mcp/jmrplens-gitlab-mcp-server
      - https://www.pulsemcp.com/servers/jmrplens-gitlab
      - https://mcpservers.org/servers/jmrplens/gitlab-mcp-server
      # VerifyMCP audits the LIVE endpoint (mcp.jmrp.io/gitlab), not the repo,
      # and publishes its own SoftwareApplication node for this server.
      - https://verifymcp.io/servers/jmrplens-gitlab-mcp-server/gitlab
      - https://pickmcp.com/servers/jmrplens/gitlab-mcp-server
      # WinGet: publisher namespace of his own in Microsoft's official
      # community repository, with the manifests signed by him.
      - https://github.com/microsoft/winget-pkgs/tree/master/manifests/j/jmrplens/gitlab-mcp-server
      - https://hub.docker.com/r/jmrplens/gitlab-mcp-server
      - https://doi.org/10.5281/zenodo.21215045
    topics:
      - { name: Model Context Protocol, wikidata: Q133436854 }
      - { name: GitLab, wikidata: Q16639197 }
      - { name: Go, wikidata: Q37227 }
      - { name: DevOps, wikidata: Q3025536 }
    summary:
      en: Model Context Protocol server that exposes 850+ GitLab actions as AI-accessible tools — 1,000+ depending on edition and deployment.
      es: Servidor Model Context Protocol que expone más de 850 acciones de GitLab como herramientas accesibles para asistentes de IA — más de 1.000 según edición y despliegue.

