type: projects

# Open-source projects surfaced on /projects/ (and /es/projects/).
#
# This file is the SINGLE SOURCE for both the rendered page and the
# SoftwareApplication / SoftwareSourceCode JSON-LD nodes that link the
# canonical `https://jmrp.io/#person` entity to the software it authors.
#
# ── Rules for editing ────────────────────────────────────────────────────
# * `id` is the GitHub repo name. `softwareId` is derived as
#   `https://github.com/jmrplens/<id>#software` — the SAME @id the project's
#   own documentation site publishes, so both documents describe ONE node.
# * `name` and `summary.en` MUST match, verbatim, the `name`/`description`
#   the project's own site publishes for that @id. Divergent values on a
#   shared @id contradict each other and weaken the entity instead of
#   reinforcing it. Verified against the live sites on 2026-07-28 for:
#   gitlab-mcp-server, libgen-mcp, phonometry, cs-routeros-bouncer,
#   Cloudflare-DNS-Updater. Projects without a docs site use the repo/CV copy.
# * `summary.es` is display-only. JSON-LD always emits `summary.en`, on both
#   locales, because the software entity is language-neutral and its
#   canonical description must not fork per page.
# * `hosted`/`hostedEs` point at the PAGE documenting a public running
#   instance, not at the endpoint itself — the MCP endpoints answer 405 to a
#   browser's GET. Card link only, never JSON-LD: the running instance is a
#   different entity from the program, and mcp.jmrp.io already publishes that
#   node and links it to this project's `#software` @id via `targetProduct`.
# * `endpoint` is the raw callable MCP URL and the single source of truth for
#   the fleet: BaseHead/build-identity derive `<endpoint>#api` owns @ids from
#   it, the /homelab/ MCP card lists it, and llms.txt iterates it. Adding a
#   server = adding this field (mcp.jmrp.io/servers.json must list it too).
# * `topics[].wikidata` Q-ids are verified against the Wikidata
#   `wbgetentities` API (label + description read, not just search hit).
#   First topic → `about`, the rest → `mentions`.

projects:
  # ── Active ─────────────────────────────────────────────────────────────
  - id: gitlab-mcp-server
    name: GitLab MCP Server
    status: active
    schemaType: SoftwareApplication
    applicationCategory: DeveloperApplication
    applicationSubCategory: Version Control
    language: Go
    license: MIT
    repo: https://github.com/jmrplens/gitlab-mcp-server
    docs: https://jmrplens.github.io/gitlab-mcp-server/
    docsEs: https://jmrplens.github.io/gitlab-mcp-server/es/
    hosted: https://mcp.jmrp.io/#gitlab
    hostedEs: https://mcp.jmrp.io/es/#gitlab
    endpoint: https://mcp.jmrp.io/gitlab
    sameAs:
      - https://glama.ai/mcp/servers/jmrplens/gitlab-mcp-server
      - https://cursor.directory/plugins/gitlab-mcp-server
      - https://mcp.so/server/gitlab-mcp-server/jmrplens
    topics:
      - { name: Model Context Protocol, wikidata: Q133436854 }
      - { name: GitLab, wikidata: Q16639197 }
      - { name: Go, wikidata: Q37227 }
      - { name: DevOps, wikidata: Q3025536 }
    summary:
      en: Model Context Protocol server that exposes more than 1,000 GitLab operations as AI-accessible tools.
      es: Servidor Model Context Protocol que expone más de 1.000 operaciones de GitLab como herramientas accesibles para asistentes de IA.

