sonar.organization=jmrplens
sonar.projectKey=jmrplens_jmrp.io
sonar.host.url=https://sonarcloud.io

# Source code location
# Including scripts to ensure CI logic quality
sonar.sources=src,scripts

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions
# We exclude build artifacts, dependencies, type definitions, and internal CI tools that trigger hotspots
sonar.exclusions=dist/**,node_modules/**,public/**,**/*.d.ts,.scannerwork/**,.sonar/**,**/temp/**
# Global coverage exclusion (since we focus on E2E/Static checks)
sonar.coverage.exclusions=**

# Issue suppressions for CI scripts
# These scripts intentionally use execSync/execFileSync with validated inputs
# Using multicriteria instead of inline NOSONAR since Prettier moves comments
sonar.issue.ignore.multicriteria=ci1,ci2,ci3,ci4,ci5,ci6,ci7,ci8

# cleanup-deployments.mjs - uses validated PR context from CI environment
sonar.issue.ignore.multicriteria.ci1.ruleKey=javascript:S4721
sonar.issue.ignore.multicriteria.ci1.resourceKey=scripts/ci/cleanup-deployments.mjs

# deploy-report.mjs - strict input validation before command execution
sonar.issue.ignore.multicriteria.ci2.ruleKey=javascript:S4721
sonar.issue.ignore.multicriteria.ci2.resourceKey=scripts/ci/deploy-report.mjs

# generate-html-validation-report.mjs - hardcoded args, restricted PATH
sonar.issue.ignore.multicriteria.ci3.ruleKey=javascript:S4721
sonar.issue.ignore.multicriteria.ci3.resourceKey=scripts/ci/generate-html-validation-report.mjs

# run-lighthouse-audit.mjs - hardcoded lighthouse command
sonar.issue.ignore.multicriteria.ci4.ruleKey=javascript:S4721
sonar.issue.ignore.multicriteria.ci4.resourceKey=scripts/run-lighthouse-audit.mjs

# run-verify.mjs - internal CI script with hardcoded commands
sonar.issue.ignore.multicriteria.ci5.ruleKey=javascript:S4721
sonar.issue.ignore.multicriteria.ci5.resourceKey=scripts/run-verify.mjs

# optimize-favicons.mjs - simple regex for hostname extraction
sonar.issue.ignore.multicriteria.ci6.ruleKey=javascript:S5852
sonar.issue.ignore.multicriteria.ci6.resourceKey=scripts/optimize-favicons.mjs

# generate-html-validation-report.mjs - PATH variable warning
sonar.issue.ignore.multicriteria.ci7.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.ci7.resourceKey=scripts/ci/generate-html-validation-report.mjs

# run-lighthouse-audit.mjs - PATH variable warning
sonar.issue.ignore.multicriteria.ci8.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.ci8.resourceKey=scripts/run-lighthouse-audit.mjs

# Javascript/Typescript specific
sonar.typescript.tsconfigPath=tsconfig.json

# Quality Gate
sonar.qualitygate.wait=true

# New Code Definition
sonar.newCode.referenceBranch=main

# Analysis metadata
sonar.projectVersion=1.0.0
sonar.links.homepage=https://jmrp.io
sonar.links.scm=https://github.com/jmrplens/jmrp.io
