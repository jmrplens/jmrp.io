sonar.organization=jmrplens
sonar.projectKey=jmrplens_jmrp.io
sonar.host.url=https://sonarcloud.io

# Source code location
# Including scripts to ensure CI logic quality
sonar.sources=src,scripts

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions
# We exclude build artifacts, dependencies, and type definitions
sonar.exclusions=dist/**,node_modules/**,public/**,**/*.d.ts,.scannerwork/**,.sonar/**,**/temp/**
# Global coverage exclusion (since we focus on E2E/Static checks)
sonar.coverage.exclusions=**

# Javascript/Typescript specific
sonar.typescript.tsconfigPath=tsconfig.json

# Quality Gate - Handle validation in local script
sonar.qualitygate.wait=false

# New Code Definition
sonar.newCode.referenceBranch=main

# Analysis metadata
sonar.projectVersion=1.0.0
sonar.links.homepage=https://jmrp.io
sonar.links.scm=https://github.com/jmrplens/jmrp.io
