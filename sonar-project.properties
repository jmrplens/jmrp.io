sonar.organization=jmrplens
sonar.projectKey=jmrplens_jmrp.io
sonar.host.url=https://sonarcloud.io

# Source code location
# Including scripts to ensure CI logic quality
sonar.sources=src,scripts

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions
# We exclude build artifacts, dependencies, type definitions, and internal CI tools that trigger hotspots
sonar.exclusions=dist/**,builds/**,node_modules/**,public/**,**/*.d.ts,.scannerwork/**,.sonar/**,**/temp/**,src/assets/nedry-assets.ts,scripts/generate-brand.mjs
# Global coverage exclusion (since we focus on E2E/Static checks)
sonar.coverage.exclusions=**
# CPD (Copy-Paste Detection) exclusions
# Translation files (EN/ES) share identical key structures by design — not real duplication
sonar.cpd.exclusions=src/i18n/translations/**

# Issue suppressions for CI scripts
# These scripts intentionally use execSync/execFileSync with validated inputs
# Using multicriteria instead of inline NOSONAR since Prettier moves comments
sonar.issue.ignore.multicriteria=ci1,ci3,ci4,ci5,ci7,ci8,ci9,ci10,ci12,ci13,ci15,ci16,ci17,ci18,ci19,ci20,ci21

# S4721 - OS Command Injection (inherited from process.env)
sonar.issue.ignore.multicriteria.ci1.ruleKey=javascript:S4721
sonar.issue.ignore.multicriteria.ci1.resourceKey=scripts/ci/cleanup-deployments.mjs

sonar.issue.ignore.multicriteria.ci3.ruleKey=javascript:S4721
sonar.issue.ignore.multicriteria.ci3.resourceKey=scripts/ci/generate-html-validation-report.mjs

sonar.issue.ignore.multicriteria.ci4.ruleKey=javascript:S4721
sonar.issue.ignore.multicriteria.ci4.resourceKey=scripts/run-lighthouse-audit.mjs

sonar.issue.ignore.multicriteria.ci5.ruleKey=javascript:S4721
sonar.issue.ignore.multicriteria.ci5.resourceKey=scripts/run-verify.mjs

# S5852 - Regex complexity in CI/utility scripts
sonar.issue.ignore.multicriteria.ci7.ruleKey=javascript:S5852
sonar.issue.ignore.multicriteria.ci7.resourceKey=scripts/optimize-favicons.mjs

# S4036 - OS command shell security (PATH)
sonar.issue.ignore.multicriteria.ci8.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.ci8.resourceKey=scripts/ci/generate-html-validation-report.mjs

sonar.issue.ignore.multicriteria.ci9.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.ci9.resourceKey=scripts/run-lighthouse-audit.mjs

sonar.issue.ignore.multicriteria.ci10.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.ci10.resourceKey=scripts/optimize-favicons.mjs

sonar.issue.ignore.multicriteria.ci12.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.ci12.resourceKey=src/integrations/post-build.ts

# S7924 - CSS contrast false positives on alpha-composited backgrounds (10% opacity)
sonar.issue.ignore.multicriteria.ci13.ruleKey=css:S7924
sonar.issue.ignore.multicriteria.ci13.resourceKey=src/styles/components/service-stats.css

# S8705/S8707 - jssecurity taint rules in CI report tooling. These scripts take
# only fixed, in-tree paths from the CI workflow (never user input) and already
# validate args (allow-list + no "..") and path containment (startsWith cwd);
# the taint analyzer does not recognize those guards, so suppress per file.
sonar.issue.ignore.multicriteria.ci15.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.ci15.resourceKey=scripts/ci/format-lighthouse-report.mjs

sonar.issue.ignore.multicriteria.ci16.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.ci16.resourceKey=scripts/ci/format-schema-report.mjs

sonar.issue.ignore.multicriteria.ci17.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.ci17.resourceKey=scripts/ci/generate-accessibility-index.mjs

sonar.issue.ignore.multicriteria.ci18.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.ci18.resourceKey=scripts/ci/generate-lighthouse-index.mjs

# S3776 - ServerInsights renders a distinct stat layout per server type
# (matrix/mastodon/truenas/mikrotik). The validation dispatch is extracted to a
# helper, but the per-type render branching is inherent to the design and
# accepted (see the component JSDoc); splitting it would not improve clarity.
sonar.issue.ignore.multicriteria.ci19.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.ci19.resourceKey=src/components/homelab/ServerInsights.tsx

# S4721 - brand asset generator drives ImageMagick/ffmpeg/img2webp via
# execFileSync with hard-coded arg arrays (no shell, no user input).
sonar.issue.ignore.multicriteria.ci20.ruleKey=javascript:S4721
sonar.issue.ignore.multicriteria.ci20.resourceKey=scripts/generate-brand.mjs

# S2699 - false positive: node:test suites assert via node:assert
# (assert.equal/assert.ok), which Sonar's assertion detection does not
# recognize as an assertion library. Every test in these files asserts.
sonar.issue.ignore.multicriteria.ci21.ruleKey=javascript:S2699
sonar.issue.ignore.multicriteria.ci21.resourceKey=**/*.test.mjs

# Javascript/Typescript specific
sonar.typescript.tsconfigPath=tsconfig.json

# Quality Gate
sonar.qualitygate.wait=true

# New Code Definition
sonar.newCode.referenceBranch=main

# Analysis metadata
sonar.projectVersion=1.0.0
sonar.links.homepage=https://jmrp.io
sonar.links.scm=https://github.com/jmrplens/jmrp.io