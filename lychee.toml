cache = true
max_cache_age = "1d"

no_progress = true

# Status codes that count as a VALID link. lychee's default is
# `100..=103, 200..=299`; 408 is the only addition.
#
# Why: the Zenodo DOIs linked from /publications/ intermittently answer 408
# Request Timeout to GitHub runners — two consecutive red runs on 2026-08-24 over
# the same links. Checked by hand from the server, all 15 doi.org links on the
# site resolve 200 and redirect to their Zenodo record.
#
# A 408 means "nobody answered in time", which is a network condition rather than
# a dead link: a real 404 or 410 still fails the check. Preferred over excluding
# `doi.org` from the sweep (the treatment acusticox.com gets below), because
# excluding it would leave 15 real links unchecked forever.
accept = ["100..=103", "200..=299", "408"]

# Exclude specific domains/URLs (Timeouts prevent checking)
exclude = [
    # --- Anti-bot 403s: these serve fine to real readers ---------------------
    # Each verified by hand from this server: a plain `curl` with a browser
    # user-agent returns 200 while lychee gets 403. Sending a browser UA in
    # lychee was tried and made things worse (it tripped additional blocks,
    # including doi.org), so the domains are skipped instead.
    'https://eprint\.iacr\.org/.*',
    # npm is a different case from the rest of this list: it answers 403 to
    # everything from this address, a browser user-agent included, so the note
    # above about a plain curl returning 200 does not apply to it. The packages
    # are real and verifiable through registry.npmjs.org, which does answer —
    # it is only the human-facing www host that refuses datacenter traffic.
    'https://www\.npmjs\.com/.*',
    'https://www\.iacr\.org/.*',
    'https://gitlab\.torproject\.org/.*',
    'https://www\.abuseipdb\.com/.*',
    # The 404 page legitimately answers 404; it is its own canonical. The
    # language switcher on it points at the other locale's 404, which Astro
    # emits as `404.html` rather than `404/index.html`, so the filesystem
    # check cannot resolve it. Nginx serves a 404 there, which is correct.
    'https://jmrp\.io/404/',
    'file://.*/404$',
    'https://profdent\.es/.*',
    'https://mstdn\.jmrp\.io/.*',
    'https://mesh\.jmrp\.io/.*',
    'https://meshmonitor\.jmrp\.io/.*',
    'https://potatomesh\.jmrp\.io/.*',
    'https://mesh_lf\.jmrp\.io/.*',
    'https://mesh_mf\.jmrp\.io/.*',
    'https://electronica-submarina\.com/.*',
    'https://ies-berlanga\.info/.*',
    'https://www\.i3m-detectors\.i3m\.upv\.es/.*',
    # The University of Alicante refuses the CI runner at TCP level
    # ("Connection refused") across all five of its hosts that the site links
    # — the main site, the school, the department, the research institute and
    # the repository. Not an outage: from this server they answer 301 or 200,
    # each checked by hand. Only the repository host was listed, which is why
    # the other four went red the moment UA started refusing.
    #
    # The subdomain group repeats rather than matching one label, because UA
    # nests: the co-author CV pages sit two labels deep. Those five had a
    # dedicated line further down, which this pattern now subsumes — so that
    # line is gone, along with the `https://`-only spelling that would have
    # failed the same way the handle above did.
    'https?://(?:[a-z0-9-]+\.)*ua\.es/.*',
    'https://www\.upv\.es/index-en\.html',
    'https://www\.upv\.es/entidades/epsg/en/home/',
    # Same scheme trap as the UPV profiles below: listed as `http://` while
    # the site emits `https://`, so the pattern matched nothing and the handle
    # surfaced as an error the moment handle.net stopped answering CI.
    'https?://hdl\.handle\.net/.*',
    # UPV's personal-profile app answers 503, or hangs past the timeout, to
    # automated requests — verified from this server one URL a second, so it is
    # not lychee's concurrency. The rest of www.upv.es answers 200 normally,
    # hence the path prefix rather than the whole domain.
    #
    # These five profiles WERE already listed, one line each and spelled
    # `http://`. #388 rewrote `coauthors.yaml` to `https://`, the patterns
    # quietly stopped matching anything, and nothing noticed for months because
    # UPV was still answering. Both schemes and a wildcard tail instead, so the
    # exclusion cannot drift again and a sixth co-author from the same faculty
    # is covered without touching this file.
    #
    # Two lines rather than one `https?://`: cspell skips text it can parse as
    # a URL, and `https?://` is not one, so the single-pattern version made the
    # spell checker read the path as prose and reject the Spanish word in it.
    'http://www\.upv\.es/ficha-personal/.*',
    'https://www\.upv\.es/ficha-personal/.*',
    'https://nojigon\.webs\.upv\.es/.*',
    'https://www\.csic\.es/.*',
    'https://cienciagandia\.webs\.upv\.es/.*',
    'https://i3m\.csic\.upv\.es/.*',
    'https://igic\.webs\.upv\.es/.*',
    # Ignore Astro/Template variables
    '.*\$\{.*',
    '.*\%7B.*',
    '.*\%7D.*',
    # Blocked bots or auth required
    'linkedin\.com',
    'cloudflare\.com',
    'trevorcox\.me',
    'scholar\.google\.com',
    'scholar\.google\.es',
    'youtube\.com/embed/',
    'mathworks\.com',                  # AUTOSAR rule pages — 403 to bots
    'https://report-uri\.com/.*',      # Scott Helme's Report URI — 403 to every
                                       # checker UA (old and new paths alike);
                                       # serves fine to real readers
    'gnu\.org/software/gettext',       # gettext .mo manual — 429 rate-limit
    'gnu\.org/licenses/',              # GPL/AGPL texts — 429 rate-limit (linked
                                       # as SoftwareApplication `license` from
                                       # every GPL project on /projects/)
    'cursor\.directory',               # Cursor directory — 429 rate-limit to bots
    'glama\.ai',                       # Glama MCP directory — slow, times out in CI
    'cs\.android\.com',                # Android Code Search — JS SPA, 404s to bots
    'learn\.microsoft\.com',           # MS Learn — 403s to bots
    'icu\.unicode\.org',               # ICU design docs — bot-blocked
    # RSS/Atom Namespaces
    'http://www\.w3\.org/2005/Atom',
    'http://purl\.org/rss/1.0/modules/content/',
    'http://search\.yahoo\.com/mrss/',
    # Localhost
    'http://localhost.*',
    # Third-party site with intermittent availability (500s/timeouts observed
    # 2026-07-05..07); caused repeated false reds in verify. Linked from the CV.
    'https://acusticox\.com/',
]

# File globs to check (used locally)
include = [
    "./**/*.md",
    "./**/*.mdx",
    "./src/**/*.astro",
    "./src/**/*.ts",
    "./src/**/*.tsx"
]

exclude_path = [
    "node_modules",
    "design-audit"
]

# Show only errors
verbose = "error"
