cache = true
max_cache_age = "1d"

no_progress = true

# Exclude specific domains/URLs (Timeouts prevent checking)
exclude = [
    'https://profdent\.es/.*',
    'https://mstdn\.jmrp\.io/.*',
    'https://mesh\.jmrp\.io/.*',
    'https://meshmonitor\.jmrp\.io/.*',
    'https://potatomesh\.jmrp\.io/.*',
    'https://mesh_lf\.jmrp\.io/.*',
    'https://mesh_mf\.jmrp\.io/.*',
    'https://electronica-submarina\.com/.*',
    'https://ies-berlanga\.info/.*',
    'https://www\.i3m-detectors\.i3m\.upv\.es/.*',
    'https://rua\.ua\.es/.*',
    'https://www\.upv\.es/index-en\.html',
    'https://www\.upv\.es/entidades/epsg/en/home/',
    'http://hdl\.handle\.net/.*',
    'http://www\.upv\.es/ficha-personal/alcebrui',
    'http://www\.upv\.es/ficha-personal/fracasra',
    'http://www\.upv\.es/ficha-personal/lmgarcia',
    'http://www\.upv\.es/ficha-personal/rpico',
    'http://www\.upv\.es/ficha-personal/victorsm',
    'https://nojigon\.webs\.upv\.es/.*',
    'https://www\.csic\.es/.*',
    'https://cienciagandia\.webs\.upv\.es/.*',
    'https://i3m\.csic\.upv\.es/.*',
    'https://igic\.webs\.upv\.es/.*',
    'https://cvnet\.cpd\.ua\.es/.*',
    # Ignore Astro/Template variables
    '.*\$\{.*',
    '.*\%7B.*',
    '.*\%7D.*',
    # Blocked bots or auth required
    'linkedin\.com',
    'cloudflare\.com',
    'trevorcox\.me',
    'scholar\.google\.com',
    'scholar\.google\.es',
    'youtube\.com/embed/',
    'mathworks\.com',                  # AUTOSAR rule pages — 403 to bots
    'gnu\.org/software/gettext',       # gettext .mo manual — 429 rate-limit
    'gnu\.org/licenses/',              # GPL/AGPL texts — 429 rate-limit (linked
                                       # as SoftwareApplication `license` from
                                       # every GPL project on /projects/)
    'cursor\.directory',               # Cursor directory — 429 rate-limit to bots
    'glama\.ai',                       # Glama MCP directory — slow, times out in CI
    'cs\.android\.com',                # Android Code Search — JS SPA, 404s to bots
    'learn\.microsoft\.com',           # MS Learn — 403s to bots
    'icu\.unicode\.org',               # ICU design docs — bot-blocked
    # RSS/Atom Namespaces
    'http://www\.w3\.org/2005/Atom',
    'http://purl\.org/rss/1.0/modules/content/',
    'http://search\.yahoo\.com/mrss/',
    # Localhost
    'http://localhost.*',
    # Third-party site with intermittent availability (500s/timeouts observed
    # 2026-07-05..07); caused repeated false reds in verify. Linked from the CV.
    'https://acusticox\.com/',
]

# File globs to check (used locally)
include = [
    "./**/*.md",
    "./**/*.mdx",
    "./src/**/*.astro",
    "./src/**/*.ts",
    "./src/**/*.tsx"
]

exclude_path = [
    "node_modules",
    "design-audit"
]

# Show only errors
verbose = "error"
