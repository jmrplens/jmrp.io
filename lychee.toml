cache = true
max_cache_age = "1d"

no_progress = true

# Exclude specific domains/URLs (Timeouts prevent checking)
exclude = [
    'https://scholar.google.es/citations?user=x-q6R-QAAAAJ',
    'https://www.linkedin.com/in/jmrplens',


# File globs to check (used locally)
include = [
    "./**/*.md",
    "./**/*.mdx",
    "./src/**/*.astro",
    "./src/**/*.ts",
    "./src/**/*.tsx"
]

exclude_path = [
    "node_modules"
]

# Show only errors
verbose = "error"

