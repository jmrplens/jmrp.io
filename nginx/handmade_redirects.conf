# The Autotest screenshot, recovered from the Internet Archive and now hosted
# in the repository itself. Its README no longer needs this redirect — it was
# rewritten to a repo-relative path — but any copy of the old README still
# asks for the WordPress upload path, and that copy is not ours to edit.
#
# Only one of the two screenshots survived: the start screen was never
# archived under any name, so its tag was removed rather than left broken.
location = /wp-content/uploads/2018/07/Autotest-Test.png {
    return 301 https://raw.githubusercontent.com/jmrplens/Autotest/HEAD/.github/images/Autotest-Test.png;
}

# The SetFigPaper figure gallery from the old domain. Twenty of these were
# requested in 48 hours, all with `Referer: jmrplens.com` — the old domain 301s
# here preserving the path, so a page that still links to the old gallery lands
# on us and 404s. The images survived the move: same names, now under
# `.github/images/` in the project's own repository, so this points at the
# image rather than at a page. Redirecting an <img> to HTML would break the tag
# and confuse a crawler more than the 404 does.
#
# A bounded pattern rather than the enumeration used for TFG_TEMPLATE above:
# there are 21 of them and they share one shape. A name that does not exist
# turns a 404 into a 301 to a 404, which is no worse for a request nobody
# makes. Verified 2026-09-03: every name requested in the logs exists upstream.
location ~* ^/GitHub_setfigpaper/(?<sfp_asset>plot[0-9]+[a-z]*|matlab-pick-of-the-week-[0-9]+)\.(?<sfp_ext>png|svg)$ {
    return 301 https://raw.githubusercontent.com/jmrplens/SetFigPaper/HEAD/.github/images/$sfp_asset.$sfp_ext;
}

# The identity contract at the path someone would guess. Six external
# repositories read the canonical document from raw.githubusercontent, but a
# human — or a client following the `#person` @id — reasonably looks for it at
# the site root. Four requests in 48 hours, all `curl`. The canonical location
# does not move; this only saves the guess.
location = /person.jsonld {
    return 301 https://jmrp.io/identity/person.jsonld;
}

# Directories the build leaves without an index.html. Nginx answers a bare
# directory with 403 (autoindex is off), which is the one status the site
# never means: a genuine bingbot took a 403 for `/es/blog/tags/` on
# 2026-09-04. The parent pages already carry the whole tag cloud and every
# category, so the hub URL a crawler guesses lands on the page that has the
# content. The two asset directories have no page to send anyone to.
location = /blog/tags/ {
    return 301 /blog/;
}
location = /es/blog/tags/ {
    return 301 /es/blog/;
}
location = /tools/categories/ {
    return 301 /tools/;
}
location = /es/tools/categories/ {
    return 301 /es/tools/;
}
location = /downloads/ {
    return 404;
}
location = /nedry/ {
    return 404;
}

# llms.txt at the path some crawlers guess. llmstxt.org places the file at
# the site root and that is the only copy; two crawlers asked under
# `/.well-known/` in 24 hours (2026-09-04). A redirect keeps one canonical
# URL instead of a second copy the build would have to keep in sync.
location = /.well-known/llms.txt {
    return 301 /llms.txt;
}

# cspell:ignore contacto setfigpaper
# Contact pages that never existed here. The old domain 301s preserving the
# path, and a crawler or a bookmark still asks for `/contact` (nine requests
# in 14 days, one with `Referer: jmrplens.com`) and `/contacto/`. The about
# page is where the contact information lives, in each language.
location ~* ^/contact/?$ {
    return 301 /about/;
}
location ~* ^/contacto/?$ {
    return 301 /es/about/;
}
