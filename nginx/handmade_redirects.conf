# Hand-curated redirects, log-driven — included at SERVER level from
# jmrp.io.conf (unlike the three GENERATED http-level maps beside it).
# Each entry earns its place from origin-log evidence; date and count noted.
# 2026-08-26, from the first log analysis with the worker's request registry.

# Fediverse-style handle probes on the apex (6 hits): the profile lives on the
# Mastodon instance. Also covers the bare @jmrp.io convention.
location = /@jmrplens {
    return 301 https://mstdn.jmrp.io/@jmrplens;
}

location = /@jmrp.io {
    return 301 https://mstdn.jmrp.io/@jmrplens;
}

# /docs and /docs/ 404ed (3 hits) while every /docs/<project> 301s to its docs
# site: the natural index for "which projects have docs" is the projects page.
location = /docs {
    return 301 /projects/;
}

location = /docs/ {
    return 301 /projects/;
}

# MCP-aware agents probing the apex for server discovery (4 hits across
# /.well-known/mcp.json and /.well-known/webmcp; plus POST /sse and
# /api/v1/mcp, which cannot be redirected meaningfully — a POST body does not
# survive a cross-origin 301, and there is no single generic endpoint to give
# it). servers.json is the machine-readable index mcp.jmrp.io already serves.
# The MCP fleet lives on its own host; /mcp is what people (and scanners) try
# on the apex first — measured in the access log, and there is nothing at that
# path to find. Same destination the .well-known pointers below already use.
location = /mcp {
    return 301 https://mcp.jmrp.io/;
}
location = /mcp/ {
    return 301 https://mcp.jmrp.io/;
}
location = /.well-known/mcp.json {
    return 301 https://mcp.jmrp.io/servers.json;
}

location = /.well-known/webmcp {
    return 301 https://mcp.jmrp.io/;
}

# 2026-08-28, from the second log analysis (111 days of origin logs).
# RFC 9116 §3 makes /.well-known/security.txt the only normative location and
# says the legacy top-level path "should not" be used — but scanners and
# researchers still probe it (12 hits, still current). Pointing them at the
# signed file costs one 301 and beats a 404 for someone trying to report a
# vulnerability.
location = /security.txt {
    return 301 /.well-known/security.txt;
}

# 2026-08-29, from the 36-hour origin-log review.
#
# `/GitHub_TFGTemplate/*` (42 hits) is served to GitHub's image proxy: the
# user agent is `github-camo`, which means live GitHub content still points
# here. The template repo has 84 stars and 29 forks, and a fork freezes the
# README it was taken from — so those URLs will keep arriving no matter what
# the upstream README says today. Redirecting is the only lever that reaches
# a fork without touching anyone's repository.
#
# The images were never lost, only renamed: the v2.0.0 rewrite
# (eaf6891) replaced opaque names with the degree each cover belongs to.
# The mapping below was recovered twice over and the two agree — background
# colour groups each cover by degree, and OCR of the degree line separates
# the bachelor's cover from the master's, which share a colour.
#
# Not mapped on purpose: the `Poster*` series. Those documented the poster
# template, which v2.0.0 dropped entirely (not one mention of tikzposter
# survives), and the wiki that referenced them was retired the same day.

